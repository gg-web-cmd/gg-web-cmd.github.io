<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발명특허교실</title>
<meta name="description" content="생활 속 불편 찾기부터 명세서 작성, 특허 출원까지 8단계로 안내하는 학생용 발명 교실">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💡%3C/text%3E%3C/svg%3E">
<style>
:root {
  --ink: #1d2433; --sub: #5a6478; --line: #dde2ec; --bg: #f4f6fb; --card: #ffffff;
  --pri: #2457c5; --pri-soft: #e8eefc; --acc: #f0a43a; --acc-soft: #fff4e2;
  --ok: #1f8a5b; --ok-soft: #e6f6ee; --bad: #c8392b; --bad-soft: #fdeceb; --warn: #b7791f; --warn-soft: #fff6e0;
  --deep: #6b4fbb; --deep-soft: #f1edfb; --radius: 14px;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pri); }
:focus-visible { outline: 3px solid #8fb0f5; outline-offset: 2px; }

/* ---------- 상단 ---------- */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--line);
}
.brand { border: 0; background: none; font-weight: 800; font-size: 1.15rem; cursor: pointer; padding: 4px 6px; color: var(--pri); }
.who { display: flex; gap: 10px; align-items: baseline; min-width: 0; flex: 1; }
.who .ttl { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.save { font-size: .85rem; color: var(--ok); white-space: nowrap; }
.save.saving { color: var(--sub); }
.save.full { color: var(--bad); font-weight: 700; }

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--pri); background: #fff; color: var(--pri);
  border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; text-decoration: none; line-height: 1.3;
}
.btn:hover { background: var(--pri-soft); }
.btn.primary { background: var(--pri); color: #fff; }
.btn.primary:hover { background: #1b47a8; }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { background: #eef1f7; }
.btn.small { padding: 4px 10px; font-size: .88rem; }
.btn.big { padding: 12px 22px; font-size: 1.05rem; }
.filebtn { cursor: pointer; }
.x { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 9px; cursor: pointer; color: var(--sub); }
.x:hover { color: var(--bad); border-color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; }
.seg button.on { background: var(--pri); color: #fff; font-weight: 700; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

/* ---------- 레이아웃 ---------- */
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 20px; }
.side { position: sticky; top: 70px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
.phase { font-size: .78rem; font-weight: 700; color: var(--sub); margin: 12px 4px 2px; letter-spacing: .02em; }
.stepbtn {
  display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto 6px; gap: 2px 8px; align-items: center;
  border: 1px solid transparent; background: none; border-radius: 12px; padding: 8px 10px; text-align: left; cursor: pointer;
}
.stepbtn:hover { background: #fff; border-color: var(--line); }
.stepbtn.on { background: #fff; border-color: var(--pri); box-shadow: 0 2px 8px rgba(36, 87, 197, .1); }
.stepbtn .num { grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--pri-soft); color: var(--pri); display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.stepbtn.on .num { background: var(--pri); color: #fff; }
.stepbtn .lbl { font-weight: 600; font-size: .95rem; }
.bar { display: block; height: 6px; background: #e5e9f2; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; transition: width .3s; }
.bar.big { height: 10px; flex: 1; }
main { min-width: 0; outline: none; }

/* ---------- 단계 머리 ---------- */
.stephead { background: linear-gradient(135deg, #fff 60%, var(--pri-soft)); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; }
.stephead .badge { display: inline-block; background: var(--pri); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: .85rem; font-weight: 700; }
.stephead h2 { margin: 8px 0 4px; font-size: 1.6rem; }
.goal { margin: 0 0 8px; font-size: 1.05rem; }
.todo { margin: 0; padding-left: 20px; color: var(--sub); }
.tcomment { margin-top: 12px; background: var(--acc-soft); border: 1px solid #f3cf95; border-radius: 12px; padding: 10px 14px; }
.tcomment p { margin: 4px 0 0; }

/* ---------- 카드·필드 ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px; }
.card h3 { margin: 0 0 6px; font-size: 1.15rem; }
.card h4 { margin: 14px 0 6px; }
.card.sec h3 { color: var(--pri); }
.sub { margin: 0 0 12px; color: var(--sub); }
.mini { font-size: .88rem; color: var(--sub); margin: 4px 0; }
.empty { color: var(--sub); background: #f7f8fb; border: 1px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; }
.fld { margin: 10px 0; }
.fld label { display: block; font-weight: 700; margin-bottom: 4px; }
.fld input, .fld textarea, .fld select, .kw input, .eff input, .claim textarea, .memo input, .comp-h input {
  width: 100%; border: 1px solid #cdd4e1; border-radius: 10px; padding: 9px 12px; background: #fff;
}
.fld textarea, .claim textarea { resize: vertical; min-height: 44px; }
.fld input:focus, .fld textarea:focus, .kw input:focus, .eff input:focus, .claim textarea:focus { border-color: var(--pri); outline: none; box-shadow: 0 0 0 3px var(--pri-soft); }
select { border: 1px solid #cdd4e1; border-radius: 10px; padding: 7px 10px; background: #fff; max-width: 100%; }
.hint { margin: 0 0 6px; font-size: .9rem; color: var(--sub); }
.ex { margin: 4px 0 0; font-size: .88rem; color: #7a8395; }
.count { margin: 4px 0 0; font-size: .85rem; color: var(--sub); text-align: right; }
.count.over { color: var(--bad); font-weight: 700; }
.term { display: inline-block; font-size: .75rem; font-weight: 600; color: var(--deep); background: var(--deep-soft); border-radius: 6px; padding: 0 6px; vertical-align: middle; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.tip { margin: 10px 0 0; background: var(--acc-soft); border-radius: 10px; padding: 9px 12px; font-size: .93rem; }
.tip.deep { background: var(--deep-soft); }
.tip.deep b { color: var(--deep); }
.warnbox { margin-top: 12px; background: var(--warn-soft); border: 1px solid #f0d28a; border-radius: 10px; padding: 10px 14px; }
.okbox { background: var(--ok-soft); border: 1px solid #a9dcc2; border-radius: 10px; padding: 12px 14px; font-weight: 600; }
.okbox.big { font-size: 1.15rem; text-align: center; padding: 20px; }
.rules { background: #f7f8fb; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: .93rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip.on { background: var(--pri); border-color: var(--pri); color: #fff; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 6px 2px; cursor: pointer; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.check.big { padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.radio { white-space: nowrap; cursor: pointer; }
.pill { display: inline-block; background: var(--pri-soft); color: var(--pri); border-radius: 999px; padding: 0 10px; font-weight: 700; font-size: .85rem; }
.pill.indep { background: var(--acc-soft); color: #9a5b00; }

/* 1단계 메모 */
.memo { list-style: none; padding: 0; margin: 0 0 8px; }
.memo li { display: flex; gap: 6px; margin-bottom: 6px; }

/* 2단계 */
.techs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tech { display: flex; flex-direction: column; gap: 3px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.tech:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0, 0, 0, .08); border-color: var(--pri); }
.tech.pick { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.tech .ic { font-size: 1.6rem; }
.tech .q { font-size: .88rem; }
.tech .ex { font-size: .8rem; color: var(--sub); }
.idea { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fbfcfe; }
.idea-h { display: flex; gap: 8px; align-items: center; }
.idea-h select { flex: 1; }
.seps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.sep { text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; }
.sep span { font-size: .88rem; color: var(--sub); }
.sep.on { border-color: var(--deep); background: var(--deep-soft); }

/* 3단계 */
.tablewrap { overflow-x: auto; }
table.score { width: 100%; border-collapse: collapse; }
table.score th, table.score td { border-bottom: 1px solid var(--line); padding: 8px; text-align: center; vertical-align: middle; }
table.score th { background: #f7f8fb; font-size: .9rem; }
table.score td:first-child { text-align: left; }
table.score tr.on td { background: var(--pri-soft); }
table.score .sum { font-weight: 800; font-size: 1.1rem; }
.pmi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 12px; }

/* 4단계 */
.choice2, .choice3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice3 { grid-template-columns: repeat(3, 1fr); }
.opt { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: #fff; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt b { font-size: 1.05rem; }
.opt span { font-size: .9rem; color: var(--sub); }
.opt.on { border-color: var(--pri); background: var(--pri-soft); }
.comp { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fbfcfe; }
.comp.child { margin-left: 34px; border-left: 4px solid var(--pri-soft); }
.comp-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.comp-h .cname { flex: 1 1 200px; font-weight: 700; }
.numb { min-width: 44px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 800; }
.core { display: flex; gap: 4px; align-items: center; white-space: nowrap; font-size: .92rem; cursor: pointer; }
.ctl { display: inline-flex; gap: 4px; }
.draw { display: grid; grid-template-columns: 200px 1fr; gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.thumb { border: 1px solid var(--line); border-radius: 8px; background: #fff; height: 160px; display: grid; place-items: center; overflow: hidden; color: var(--sub); }
.thumb img { max-width: 100%; max-height: 100%; }
.draw-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* 5단계 */
.kw { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; margin-bottom: 8px; }
.query { background: #1d2433; color: #fff; border-radius: 10px; padding: 14px; overflow-x: auto; }
.query code { font-family: Consolas, "D2Coding", monospace; font-size: 1rem; white-space: pre-wrap; word-break: break-all; }
.found { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; background: #fbfcfe; }
.cmps { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0; }
.cmp { display: inline-flex; gap: 6px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; }

/* 6단계 */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; top: 62px; z-index: 5; background: var(--bg); padding: 8px 0; }
.eff { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; }
.claim { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: #fbfcfe; }
.claim-h { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.claim-h .ctl { margin-left: auto; }

/* 7단계 */
.bars { display: grid; gap: 6px; }
.barrow { display: grid; grid-template-columns: 170px 1fr 48px; gap: 10px; align-items: center; border: 0; background: none; text-align: left; cursor: pointer; padding: 4px; border-radius: 8px; }
.barrow:hover { background: #f4f6fb; }
.lv { margin: 12px 0 6px; }
.lv.error { color: var(--bad); } .lv.warn { color: var(--warn); } .lv.info { color: var(--sub); }
ul.checks { list-style: none; padding: 0; margin: 0; }
ul.checks li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; }
ul.checks li.error { background: var(--bad-soft); } ul.checks li.warn { background: var(--warn-soft); } ul.checks li.info { background: #f2f4f8; }
.exports { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.exp { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 14px; cursor: pointer; }
.exp:hover { border-color: var(--pri); background: var(--pri-soft); }
.exp span { font-size: 1.5rem; } .exp small { color: var(--sub); }

/* 처음 화면 */
.home { max-width: 1080px; margin: 0 auto; padding: 24px 20px 40px; }
.hero { text-align: center; padding: 24px 10px 10px; }
.hero h1 { font-size: 2.2rem; margin: 0; color: var(--pri); }
.hero p { font-size: 1.1rem; color: var(--sub); margin: 6px 0 16px; }
.journey { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0; margin: 0 0 18px; counter-reset: j; }
.journey li { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; counter-increment: j; }
.journey li::before { content: counter(j) ". "; color: var(--pri); }
.journey li span { margin-right: 4px; }
.homegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.proj { display: flex; justify-content: space-between; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 10px 0; flex-wrap: wrap; }
.proj .row { margin: 0; }
.foot { text-align: center; margin-top: 16px; }

/* 선생님 화면 */
.teacher { max-width: 1240px; margin: 0 auto; padding: 20px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.tabs button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.drop { display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; border: 2px dashed #b8c3da; border-radius: var(--radius); padding: 26px; background: #fff; cursor: pointer; margin-bottom: 14px; }
.drop.over { border-color: var(--pri); background: var(--pri-soft); }
.drop span { color: var(--sub); font-size: .9rem; }
.minibars { display: flex; gap: 3px; justify-content: center; height: 26px; align-items: flex-end; }
.minibars span { width: 9px; height: 100%; background: #e5e9f2; border-radius: 3px; display: flex; align-items: flex-end; }
.minibars i { display: block; width: 100%; background: var(--ok); border-radius: 3px; }
td.err { color: var(--bad); font-weight: 800; } td.wrn { color: var(--warn); font-weight: 700; }
dl.sum { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 0 0 10px; }
dl.sum dt { font-weight: 700; color: var(--sub); } dl.sum dd { margin: 0; }
.tcomments textarea { min-height: 40px; }
table.guide td, table.guide th { text-align: left; font-size: .9rem; vertical-align: top; }
.plan { margin: 0; padding-left: 22px; } .plan li { margin: 4px 0; }

/* 명세서 미리보기 */
.specbox { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 24px 30px; max-height: 70vh; overflow: auto; font-family: "Batang", "바탕", serif; color: #000; }
.specbox p { margin: 0 0 6px; line-height: 1.9; }
.specbox .sp-h1 { text-align: center; font-weight: 700; margin-top: 12px; }
.specbox .sp-h2 { font-weight: 700; margin-top: 8px; }
.specbox .sp-p { text-indent: 1em; }
.specbox .sp-break { border-top: 2px dashed #ccc; padding-top: 14px; margin-top: 20px; }
.specbox .sp-img { text-align: center; margin: 6px 0 14px; }
.specbox .sp-img img { max-width: 70%; border: 1px solid #eee; }

/* 모달 */
.modal { position: fixed; inset: 0; background: rgba(20, 26, 40, .55); z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal-in { background: #fff; border-radius: var(--radius); width: min(980px, 100%); max-height: 94vh; overflow: auto; padding: 16px 20px; }
.modal-in.wide { width: min(900px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.modal-h .row { margin: 0; }
.draw-modal { width: min(1100px, 100%); }
.dtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.dtools label { display: inline-flex; gap: 4px; align-items: center; font-size: .9rem; }
.canvaswrap { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.canvaswrap canvas { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; z-index: 200; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); transition: opacity .5s; max-width: 90vw; }
.toast.bad { background: var(--bad); }
.toast.out { opacity: 0; }

/* 단계 이동 */
.stepnav { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0 40px; }

/* 작은 화면 */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  .side { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .phase { display: none; }
  .stepbtn { min-width: 150px; }
  .grid2, .pmi, .homegrid, .choice3, .seps { grid-template-columns: 1fr; }
  .draw { grid-template-columns: 1fr; }
  .kw, .eff { grid-template-columns: 1fr; }
  .barrow { grid-template-columns: 120px 1fr 44px; }
  .comp.child { margin-left: 12px; }
  .toolbar { top: 0; position: static; }
}
@media (max-width: 560px) {
  .choice2 { grid-template-columns: 1fr; }
  .top { padding: 8px 12px; }
  .card { padding: 16px; }
  .stephead h2 { font-size: 1.35rem; }
}

/* 인쇄 */
@media print {
  body.printing > *:not(.modal) { display: none !important; }
  body.printing .modal { position: static; background: none; padding: 0; display: block; }
  body.printing .modal-in { max-height: none; overflow: visible; padding: 0; width: 100%; }
  body.printing .modal-h { display: none; }
  body.printing .specbox { border: 0; max-height: none; overflow: visible; padding: 0; }
  body.printing .sp-break { break-before: page; border: 0; }
}

/* ---------- 추가: 3칸 입력, 연산자 표, 일정, 보고서 ---------- */
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 12px; }
.techs.persp { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
table.ops { border-collapse: collapse; margin: 12px 0 6px; font-size: .92rem; }
table.ops th, table.ops td { border: 1px solid var(--line); padding: 5px 12px; text-align: left; }
table.ops th { background: #f7f8fb; }
ul.tips { margin: 6px 0 0; padding-left: 20px; }
ul.tips li { margin: 2px 0; }
table.fee { max-width: 520px; }
table.fee td:first-child { font-weight: 600; }
ol.timeline { list-style: none; padding: 0; margin: 14px 0 6px; border-left: 3px solid var(--pri-soft); }
ol.timeline li { position: relative; padding: 4px 0 8px 18px; }
ol.timeline li::before { content: ""; position: absolute; left: -8px; top: 10px; width: 13px; height: 13px; border-radius: 50%; background: var(--pri); }
ol.timeline li b { display: inline-block; min-width: 116px; color: var(--pri); }
.reportbox { font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif; }
table.rep { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: .93rem; }
table.rep th, table.rep td { border: 1px solid #c9cfdb; padding: 6px 10px; text-align: left; vertical-align: top; }
table.rep th { width: 140px; background: #f2f4f8; }
table.rep th[colspan] { width: auto; background: var(--pri-soft); color: var(--pri); }
table.rep code { font-family: Consolas, "D2Coding", monospace; word-break: break-all; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } table.rep th { width: 96px; } }
@media print { body.printing table.rep { break-inside: avoid; } }

/* 2026-11-04 (2): 발명 노트, AI 그림 초안, Google Patents, 공지예외 */
.tools .btn .cnt { display: inline-block; min-width: 1.4em; padding: 0 .35em; margin-left: .2em; border-radius: 999px; background: var(--pri); color: #fff; font-size: .78em; line-height: 1.5; text-align: center; }
.modal-in.notes { max-width: 640px; width: 100%; max-height: 86vh; overflow: auto; }
.note { border: 1px solid var(--line, #d9dee7); border-radius: 10px; padding: 10px; margin: 10px 0; background: var(--card, #fff); }
.note-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.note .ndate { width: 9.5em; font-weight: 700; }
.note textarea { width: 100%; box-sizing: border-box; }
details.aibox { border: 1px dashed var(--line, #c9d0dc); border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
details.aibox summary { cursor: pointer; font-weight: 700; }
pre.prompt { white-space: pre-wrap; word-break: keep-all; background: var(--bg); border-radius: 8px; padding: 10px; font-family: inherit; font-size: .92em; margin: 8px 0; }
ul.aichk { list-style: none; padding-left: 0; margin: 4px 0; }
ul.aichk li { padding: 2px 0; }
.gp { margin: 12px 0 4px; padding-top: 10px; border-top: 1px dashed var(--line, #d9dee7); }
@media print { details.aibox, .gp { display: none; } }

/* 2026-11-05: 수업 PPT 맞춤 */
.infobox { background: var(--pri-soft); border: 1px solid #c9d6f2; border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; color: var(--ink); line-height: 1.6; }
.infobox b { color: var(--pri); }
.exports + .mini + .infobox { margin-top: 12px; }
.row.seen { gap: 10px; align-items: center; margin: 6px 0 4px; }
.row.seen .check { margin: 0; }
@media print { .infobox { display: none; } }

</style>

  function jong(word) { // 0: 받침 없음, 1: 받침 있음, 2: ㄹ 받침
    var ch = lastChar(word);
    if (!ch) return 0;
    var code = ch.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3) {
      var j = (code - 0xac00) % 28;
      return j === 0 ? 0 : (j === 8 ? 2 : 1);
    }
    if (/[0-9]/.test(ch)) return ch === "1" || ch === "7" || ch === "8" ? 2 : ("036".indexOf(ch) >= 0 ? 1 : 0);
    if (/[lL]/.test(ch)) return 2;
    if (/[mnMN]/.test(ch)) return 1;
    return 0;
  }
  // josa("우산", "은/는") -> "우산은"
  function josa(word, pair) {
    var w = String(word || "");
    var parts = pair.split("/"), j = jong(w);
    if (pair === "으로/로") return w + (j === 1 ? "으로" : "로");
    return w + (j === 0 ? parts[1] : parts[0]);
  }
  function pick(word, pair) { return josa(word, pair).slice(String(word || "").length); }

  // 문장 끝 "~한다/~된다/~있다" 를 꾸밈말 "~하는/~되는/~있는" 으로 바꾼다 (청구항용)
  function toAdnominal(s) {
    var t = String(s || "").trim().replace(/[.。]\s*$/, "");
    if (!t) return t;
    var rules = [
      [/있다$/, "있는"], [/없다$/, "없는"], [/이다$/, "인"], [/하다$/, "한"],
      [/한다$/, "하는"], [/된다$/, "되는"], [/진다$/, "지는"], [/는다$/, "는"],
      [/([가-힣])ㄴ다$/, "$1는"]
    ];
    for (var i = 0; i < rules.length; i++) if (rules[i][0].test(t)) return t.replace(rules[i][0], rules[i][1]);
    // "~(ㄴ)다" 받침형: 모은다 -> 모으는, 연다 -> 여는
    var m = t.match(/([가-힣])다$/);
    if (m) {
      var code = m[1].charCodeAt(0) - 0xac00;
      if (code >= 0 && code < 11172 && code % 28 === 4) { // ㄴ 받침 + 다
        var noJong = String.fromCharCode(0xac00 + code - 4);
        return t.slice(0, -2) + noJong + "는";
      }
    }
    return t;
  }
  // ["A","B","C"] -> "A, B 및 C"
  function joinList(arr) {
    if (arr.length <= 1) return arr.join("");
    return arr.slice(0, -1).join(", ") + " 및 " + arr[arr.length - 1];
  }
  function sentence(s) {
    var t = String(s || "").trim();
    if (!t) return "";
    return /[.!?。]$/.test(t) ? t : t + ".";
  }
  function inv(p) { return p.s4 && p.s4.type === "utility" ? "고안" : "발명"; }

  // ---------------------------------------------------------------- 구성요소·부호
  function components(p) { return (p.s4 && p.s4.components) || []; }
  function topLevel(p) { return components(p).filter(function (c) { return !c.parent; }); }
  function childrenOf(p, id) { return components(p).filter(function (c) { return c.parent === id; }); }
  function renumber(p) {
    var tops = topLevel(p);
    tops.forEach(function (c, i) {
      c.num = String((i + 1) * 10);
      childrenOf(p, c.id).forEach(function (k, j) { k.num = String((i + 1) * 10 + j + 1); });
    });
    // 순서: 상위 다음에 하위가 오도록 정렬
    var ordered = [];
    tops.forEach(function (c) { ordered.push(c); childrenOf(p, c.id).forEach(function (k) { ordered.push(k); }); });
    p.s4.components = ordered;
  }
  function nn(c) { return (c.name || "구성") + (c.num ? "(" + c.num + ")" : ""); }
  function nnj(c, pair) { return nn(c) + pick(c.name || "구성", pair); }
  function coreList(p) {
    var cs = components(p).filter(function (c) { return c.core && c.name; });
    if (!cs.length) cs = topLevel(p).filter(function (c) { return c.name; });
    return cs;
  }
  function claimElement(c) {
    var phrase = toAdnominal(c.claimPhrase || "");
    return (phrase ? phrase + " " : "") + c.name;
  }

  // ---------------------------------------------------------------- 자동 초안
  function title(p) { return (p.s6.title || "").trim() || chosenIdeaName(p) || "발명"; }
  function chosenIdea(p) {
    var ideas = (p.s2 && p.s2.ideas) || [];
    for (var i = 0; i < ideas.length; i++) if (ideas[i].id === p.s3.chosen) return ideas[i];
    return null;
  }
  function chosenIdeaName(p) { var c = chosenIdea(p); return c ? (c.name || "").trim() : ""; }

  var drafts = {
    title: function (p) { return chosenIdeaName(p); },
    field: function (p) {
      return "본 " + inv(p) + "은 " + josa(title(p), "에") + " 관한 것이다.";
    },
    background: function (p) {
      var s1 = p.s1, a = s1.analysis || {}, prod = (s1.product || "").trim(), out = [];
      if (prod && a.purpose) out.push(josa(prod, "은/는") + " " + sentence(a.purpose));
      if (prod && a.usage) out.push("일반적으로 " + josa(prod, "은/는") + " " + sentence(a.usage));
      if (s1.inconvenience) out.push("그러나 " + sentence(s1.inconvenience));
      else if (s1.sentence) out.push("그러나 " + sentence(s1.sentence));
      out.push("따라서 이러한 불편을 줄일 수 있는 새로운 " + josa(prod || title(p), "이/가") + " 필요하다.");
      return out.join(" ");
    },
    problem: function (p) {
      var imp = toAdnominal(p.s1.improve || "");
      return "본 " + inv(p) + "은 위와 같은 문제를 해결하기 위한 것으로, " +
        (imp ? imp + " " : "") + josa(title(p), "을/를") + " 제공하는 것을 목적으로 한다.";
    },
    solution: function (p) {
      var cs = coreList(p), t = title(p);
      if (!cs.length) return "";
      var out = ["상기 목적을 달성하기 위한 본 " + inv(p) + "에 따른 " + josa(t, "은/는") + ", " +
        joinList(cs.map(claimElement)) + pick(cs[cs.length - 1].name, "을/를") + " 포함한다."];
      cs.forEach(function (c) { if (c.role) out.push(josa(c.name, "은/는") + " " + sentence(c.role)); });
      components(p).forEach(function (c) {
        String(c.features || "").split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (f) {
          out.push("또한, " + josa(c.name, "은/는") + " " + toAdnominal(f) + " 것일 수 있다.");
        });
      });
      return out.join("\n");
    },
    effects: function (p) {
      var rows = (p.s6.effects || []).filter(function (e) { return (e.cause || "").trim() || (e.result || "").trim(); });
      if (!rows.length) return "";
      return rows.map(function (e) {
        return "본 " + inv(p) + "에 따르면, " + [String(e.cause || "").trim(), String(e.result || "").trim()].filter(Boolean).join(" ").replace(/[.]\s*$/, "") + ".";
      }).join("\n");
    },
    drawingDesc: function (p) {
      var ds = (p.s4 && p.s4.drawings) || [], t = title(p);
      return ds.map(function (d, i) {
        var n = i + 1, cap = (d.caption || "").trim();
        return "도 " + josa(String(n), "은/는") + " 본 " + inv(p) + "의 일 실시예에 따른 " + t + "의 " +
          (cap ? cap + " " : "") + (d.kind || "사시도") + "이다.";
      }).join("\n");
    },
    detail: function (p) {
      var t = title(p), tops = topLevel(p).filter(function (c) { return c.name; }), out = [];
      out.push("이하, 첨부된 도면을 참조하여 본 " + inv(p) + "의 바람직한 실시예를 상세히 설명한다.");
      if (tops.length) {
        out.push(((p.s4.drawings || []).length ? "도 1을 참조하면, " : "") + "본 " + inv(p) + "의 일 실시예에 따른 " +
          josa(t, "은/는") + " " + joinList(tops.map(nn)) + pick(tops[tops.length - 1].name, "을/를") + " 포함한다.");
      }
      tops.forEach(function (c) {
        var para = [];
        if (c.role) para.push(nnj(c, "은/는") + " " + sentence(c.role));
        if (c.relation) para.push(sentence(c.relation));
        var kids = childrenOf(p, c.id).filter(function (k) { return k.name; });
        if (kids.length) para.push(nnj(c, "은/는") + " " + joinList(kids.map(nn)) + pick(kids[kids.length - 1].name, "을/를") + " 포함할 수 있다.");
        kids.forEach(function (k) {
          if (k.role) para.push(nnj(k, "은/는") + " " + sentence(k.role));
          if (k.relation) para.push(sentence(k.relation));
        });
        [c].concat(kids).forEach(function (x) {
          String(x.features || "").split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (f) {
            para.push(nnj(x, "은/는") + " " + toAdnominal(f) + " 것일 수 있다.");
          });
        });
        if (para.length) out.push(para.join(" "));
      });
      (p.s4.drawings || []).forEach(function (d, i) {
        if (i === 0) return;
        var cap = (d.caption || "").trim();
        out.push("도 " + josa(String(i + 1), "을/를") + " 참조하면, " + (cap ? cap + " " : "") + (d.kind || "도면") + "에서 위 구성의 모양과 연결 관계를 더 자세히 볼 수 있다.");
      });
      if ((p.s4.usage || "").trim()) {
        out.push("다음으로, 본 " + inv(p) + "에 따른 " + josa(t, "을/를") + " 사용하는 방법을 설명한다.");
        String(p.s4.usage).split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (s) { out.push(sentence(s)); });
      }
      if ((p.s4.variants || "").trim()) {
        out.push("한편, 본 " + inv(p) + "은 위 실시예에 한정되지 않으며 다음과 같이 변형하여 실시할 수도 있다.");
        String(p.s4.variants).split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (s) { out.push(sentence(s)); });
      }
      return out.join("\n");
    },
    symbols: function (p) {
      return components(p).filter(function (c) { return c.name && c.num; }).map(function (c) { return c.num + ": " + c.name; }).join("\n");
    },
    claims: function (p) {
      var cs = coreList(p), t = title(p), claims = [];
      if (!cs.length) return claims;
      var lines = cs.map(function (c, i) {
        var el = claimElement(c);
        if (i === cs.length - 1) return el + pick(c.name, "을/를") + " 포함하는 " + t + ".";
        return el + (i === cs.length - 2 ? "; 및" : ";");
      });
      claims.push({ type: "indep", ref: "", text: lines.join("\n") });
      components(p).forEach(function (c) {
        String(c.features || "").split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (f) {
          claims.push({ type: "dep", ref: "1", text: "청구항 1에 있어서,\n상기 " + josa(c.name, "은/는") + " " + toAdnominal(f) + " 것을 특징으로 하는 " + t + "." });

      });

    },
    abstract: function (p) {
      var t = title(p), cs = coreList(p), out = ["본 " + inv(p) + "은 " + josa(t, "에") + " 관한 것이다."];
      if (cs.length) out.push("본 " + inv(p) + "에 따른 " + josa(t, "은/는") + " " + joinList(cs.map(function (c) { return c.name; })) + pick(cs[cs.length - 1].name, "을/를") + " 포함한다.");
      var eff = drafts.effects(p).split("\n")[0];
      if (eff) out.push(eff.replace(/^본 (발명|고안)에 따르면, /, "이에 따라 "));

  function draftAll(p, onlyEmpty) {
    var s6 = p.s6;
    ["title", "field", "background", "problem", "solution", "drawingDesc", "detail", "symbols", "abstract"].forEach(function (k) {
      if (!onlyEmpty || !String(s6[k] || "").trim()) s6[k] = drafts[k](p);
    });
    if (!onlyEmpty || !String(s6.effectsText || "").trim()) s6.effectsText = drafts.effects(p);
    if (!onlyEmpty || !(s6.claims || []).some(function (c) { return (c.text || "").trim(); })) s6.claims = drafts.claims(p);
    return p;
  }

  // ---------------------------------------------------------------- 선행조사 검색식
  function searchQuery(keywords, exclude) {
    var groups = (keywords || []).map(function (k) {
      var words = [k.word].concat(String(k.synonyms || "").split(/[,，\n]/)).map(function (w) { return String(w || "").trim(); }).filter(Boolean);
      var uniq = words.filter(function (w, i) { return words.indexOf(w) === i; });
      uniq = uniq.map(function (w) { return /\s/.test(w) ? '"' + w + '"' : w; });
      return uniq.length ? (uniq.length > 1 ? "(" + uniq.join("+") + ")" : uniq[0]) : "";
    }).filter(Boolean);
    var q = groups.join("*");
    var ex = String(exclude || "").split(/[,，\n]/).map(function (w) { return w.trim(); }).filter(Boolean);
    if (q && ex.length) q += ex.map(function (w) { return "*!" + w; }).join("");
    return q;
  }

  // Google Patents용 영어 검색어: 핵심 단어·비슷한 말 가운데 영어만 모아 (a OR b) (c) 꼴로
  function gpQuery(keywords) {
    var groups = (keywords || []).map(function (k) {
      var terms = [k.word].concat(String(k.synonyms || "").split(/[,，\n]/)).map(function (w) { return String(w || "").trim(); })
        .filter(function (w) { return w && /^[A-Za-z0-9][A-Za-z0-9 \-]*$/.test(w); })
        .map(function (w) { return /\s/.test(w) ? '"' + w + '"' : w; });
      terms = terms.filter(function (w, i) { return terms.indexOf(w) === i; });
      return terms.length ? (terms.length > 1 ? "(" + terms.join(" OR ") + ")" : terms[0]) : "";
    }).filter(Boolean);
    return groups.join(" ");
  }

  // ---------------------------------------------------------------- 선행기술조사 보고서
  var SEEN = [["abstract", "요약"], ["claims", "청구항"], ["drawings", "도면"], ["desc", "설명"]];
  var CMP = { same: "있음", similar: "비슷함", none: "없음", unknown: "확인 못 함" };
  var PA_STATUS = { published: "공개", registered: "등록", rejected: "거절", withdrawn: "취하·포기", expired: "소멸" };
  var PA_RELEVANCE = { "4": "75~100 (매우 비슷)", "3": "50~75 (비슷)", "2": "25~50 (일부 비슷)", "1": "0~25 (관련 적음)" };
  function priorArtReport(p) {
    var core = coreList(p);
    return {
      title: (p.s6.title || (chosenIdea(p) || {}).name || "").trim(),
      keywords: (p.s5.keywords || []).map(function (k) { return [k.word].concat(String(k.synonyms || "").split(/[,，]/)).map(function (w) { return String(w || "").trim(); }).filter(Boolean).join(", "); }),
      exclude: String(p.s5.exclude || "").trim(),
      query: p.s5.query || "",
      searchDate: p.s5.searchDate || "",
      gpQuery: gpQuery(p.s5.keywords),
      verdict: ({ go: "계속 진행", fix: "아이디어 고치기", change: "다른 아이디어로" })[p.s5.verdict] || "",
      diff: p.s5.diff || "",
      rows: (p.s5.found || []).map(function (f, i) {
        return {
          n: i + 1, no: f.no || "", title: f.title || "", status: PA_STATUS[f.status] || "", relevance: PA_RELEVANCE[f.relevance] || "",
          feature: f.memo || "", similar: f.similar || "", differ: f.differ || "", improve: f.improve || "",
          seen: SEEN.filter(function (w) { return (f.seen || {})[w[0]]; }).map(function (w) { return w[1]; }).join(" · "),
          compare: core.map(function (c) { return { name: c.name, v: CMP[(f.compare || {})[c.id]] || "-" }; })

  }

  // ---------------------------------------------------------------- 진행률
  function filled(v) { return !!String(v || "").trim(); }
  function progress(p) {
    var r = {};
    var s1 = p.s1;
    r[1] = [s1.who, s1.where, s1.sentence || s1.what, s1.product, s1.inconvenience, s1.improve].filter(filled).length / 6;
    var ideas = (p.s2.ideas || []).filter(function (i) { return filled(i.name) || filled(i.desc); }).length;
    r[2] = Math.min(1, ideas / 3);
    r[3] = (p.s3.chosen ? 0.5 : 0) + ([p.s3.pmi.p, p.s3.pmi.m, p.s3.pmi.i].filter(filled).length / 3) * 0.5;
    var cs = components(p).filter(function (c) { return filled(c.name); }).length, ds = (p.s4.drawings || []).length;
    r[4] = Math.min(1, (cs >= 2 ? 0.5 : cs * 0.25) + (ds ? 0.3 : 0) + (filled(p.s4.usage) ? 0.2 : 0));
    r[5] = (filled(p.s5.query) ? 0.4 : 0) + ((p.s5.found || []).length ? 0.3 : 0) + (p.s5.verdict ? 0.3 : 0);
    var s6 = p.s6, keys = [s6.title, s6.field, s6.background, s6.problem, s6.solution, s6.effectsText, s6.detail, s6.abstract,
      (s6.claims || []).some(function (c) { return filled(c.text); }) ? "x" : ""];
    r[6] = keys.filter(filled).length / keys.length;
    var errs = runChecks(p).filter(function (c) { return c.level === "error"; }).length;
    r[7] = r[6] < 1 ? r[6] * 0.5 : (errs ? 0.6 : 1);
    var ck = p.s8.checks || {}, total = FILING_CHECKS.reduce(function (n, g) { return n + g.items.length; }, 0);
    r[8] = Object.keys(ck).filter(function (k) { return ck[k]; }).length / total;
    Object.keys(r).forEach(function (k) { r[k] = Math.max(0, Math.min(1, r[k])); });
    return r;
  }

  // ---------------------------------------------------------------- 출원 체크리스트
  var FILING_CHECKS = [
    { group: "출원 전에 정하기", items: [

    ] },

    ] },
    { group: "서류 준비하기", items: [
      ["noErrors", "7단계 점검에서 빨간 표시를 모두 고쳤어요"],
      ["teacherOk", "선생님께 명세서 최종 확인을 받았어요"],

      ["drawingOk", "도면이 흰 바탕에 검은 선으로 또렷하게 보여요"],

      ["research", "출원 직전에 KIPRIS에서 한 번 더 검색해 새로 나온 비슷한 특허가 없는지 확인했어요"]
    ] },
    { group: "특허로에서 출원하기", items: [
      ["login", "특허로(www.patent.go.kr)에 보호자 인증으로 로그인했어요"],

      F("s1.cause", "왜 불편할까요? (원인 찾기)", { rows: 2, hint: "'왜?'를 두세 번 이어서 물어 진짜 원인을 찾아요. 원인을 알면 해결 방법이 보여요.", ex: "빗물이 우산 끝으로 모여 떨어진다 → 왜? 떨어진 물을 받을 곳이 없다" }) +
      tip("나 말고도 이 불편을 겪는 사람이 많을수록, 모두가 공감하는 좋은 발명 문제예요.") +
      F("s1.improve", "어떻게 바뀌면 좋을까요?", { rows: 2, hint: "'~할 수 있는'처럼 끝나게 쓰면 명세서에 바로 쓸 수 있어요.", ex: "빗물을 바닥에 흘리지 않고 모을 수 있는" }));

  // ------------------------------------------------------------ 2. 아이디어 내기
  function s2() {
    var cards = '<div class="techs">' + TECHS.map(function (t, i) {
      return '<button class="tech" data-act="useTech" data-i="' + i + '"><span class="ic">' + t.ic + "</span><b>" + t.k + "</b><span class=\"q\">" + t.q + '</span><span class="ex">예) ' + t.ex + "</span></button>";
    }).join("") + "</div>";
    var a = card("① 발명 기법 카드", cards + '<div class="row"><button class="btn ghost" data-act="randomTech">🎲 카드 한 장 뽑기</button><span class="mini">카드를 누르면 그 기법으로 아이디어 칸이 생겨요.</span></div>',
      { sub: "문제 문장: <b>" + esc(P.s1.sentence || P.s1.what || "(1단계에서 문제를 먼저 써 주세요)") + "</b>" });

        '<button class="x" data-act="del" data-list="s2.ideas" data-i="' + i + '" aria-label="아이디어 삭제">✕</button></div>' +
        F("s2.ideas." + i + ".name", "아이디어 이름", { ph: "예: 빗물받이 컵이 달린 우산" }) +
        F("s2.ideas." + i + ".desc", "어떻게 작동하나요?", { rows: 3, ph: "무엇을 어디에 어떻게 바꾸는지 써요." }) + "</div>";
    }).join("");
    var n = (P.s2.ideas || []).length;
    var a2 = card("② 관점 바꿔 보기", '<div class="techs persp">' + PERSPECTIVES.map(function (x, i) {

    }).join("") + "</div>", { sub: "같은 문제를 다른 방법으로 풀어 보면 더 좋은 아이디어가 나와요." });
    var b = card("③ 내 아이디어 (" + n + "개)", (ideas || '<p class="empty">아직 아이디어가 없어요. 위의 카드를 눌러 시작해요.</p>') +
      '<button class="btn" data-act="addIdea">+ 아이디어 추가</button>' + (n && n < 3 ? '<p class="mini">3개 이상 떠올리면 더 좋은 아이디어를 고를 수 있어요.</p>' : ""));
    var c = "";
    if (deep()) {

        '<p class="sub">"무엇을 좋게 하면 다른 것이 나빠지는" 문제를 찾아 나누기 원리로 풀어요.</p><div class="grid2">' +
        F("s2.contradiction.better", "좋게 하고 싶은 것", { ph: "예: 물받이 컵을 크게 하고 싶다" }) +
        F("s2.contradiction.worse", "그러면 나빠지는 것", { ph: "예: 우산이 무겁고 들고 다니기 불편하다" }) + "</div>" +
        '<div class="seps">' + SEPARATIONS.map(function (s) {
          var on = P.s2.contradiction.principle === s[0];
          return '<button class="sep' + (on ? " on" : "") + '" data-act="chip" data-k="s2.contradiction.principle" data-v="' + s[0] + '"><b>' + s[0] + "</b><span>" + s[1] + "</span></button>";

      tip("특허를 받으려면 <b>새롭고(신규성)</b>, 쉽게 생각해 낼 수 없을 만큼 <b>더 나아야 하며(진보성)</b>, 실제로 <b>만들어 쓸 수 있어야(산업상 이용가능성)</b> 해요.", true));

        F("s3.pmi.m", "M 아쉬운 점 (Minus)", { rows: 3, ph: "아쉬운 점이나 걱정되는 점은?" }) +
        F("s3.pmi.i", "I 흥미로운 점 (Interesting)", { rows: 3, ph: "더 발전시키면 재미있을 점은?" }) + "</div>" +
        F("s3.pmi.summary", "종합 의견", { rows: 2 }) +
        tip("M(아쉬운 점)은 숨기지 말고 적어요. 아쉬운 점을 해결하는 방법이 또 하나의 발명 포인트가 돼요."));
    }
    var np = card("③ 특허를 받기 어려운 경우인지 확인해요",
      NOT_PAT.map(function (x) {
        return '<label class="check"><input type="checkbox" data-k="s3.notPatentable.' + x[0] + '"' + (P.s3.notPatentable[x[0]] ? " checked" : "") + "> " + x[1] + "</label>";
      }).join("") + (Object.keys(P.s3.notPatentable).some(function (k) { return P.s3.notPatentable[k]; }) ? '<div class="warnbox">체크한 항목이 있다면 특허로 보호받기 어려울 수 있어요. 선생님과 상의해 아이디어를 고쳐 보세요.</div>' : '<p class="mini">해당하는 것이 없으면 그대로 두세요.</p>'));

  // ------------------------------------------------------------ 4. 구성과 도면
  function s4() {
    var t = card("① 무엇으로 출원할까요?",
      '<div class="choice2">' +
      '<label class="opt' + (P.s4.type !== "utility" ? " on" : "") + '"><input type="radio" name="ptype" data-k="s4.type" value="patent" data-rr' + (P.s4.type !== "utility" ? " checked" : "") + '><b>특허</b><span>새로운 기술(발명)을 보호해요. 심사를 거쳐 등록되면 권리가 생기고, 출원일 후 20년까지 보호돼요. 도면은 필요할 때 붙여요.</span></label>' +
      '<label class="opt' + (P.s4.type === "utility" ? " on" : "") + '"><input type="radio" name="ptype" data-k="s4.type" value="utility" data-rr' + (P.s4.type === "utility" ? " checked" : "") + '><b>실용신안</b><span>물건의 모양·구조를 쓸모 있게 고친 것(고안)을 보호해요. 등록되면 출원일 후 10년까지, 도면이 꼭 필요해요.</span></label></div>' +

    var cs = P.s4.components || [], tops = cs.filter(function (c) { return !c.parent; });
    var list = cs.map(function (c, i) {
      var parentOpts = [["", "큰 부품 (단독)"]].concat(tops.filter(function (x) { return x.id !== c.id; }).map(function (x) { return [x.id, "'" + (x.name || "?") + "' 안의 작은 부품"]; }));
      var hasKids = cs.some(function (k) { return k.parent === c.id; });

        '<label class="core"><input type="checkbox" data-rr data-k="s4.components.' + i + '.core"' + (c.core ? " checked" : "") + "> 꼭 필요한 부분</label>" +
        '<span class="ctl"><button class="x" data-act="moveComp" data-i="' + i + '" data-d="-1" aria-label="위로">↑</button><button class="x" data-act="moveComp" data-i="' + i + '" data-d="1" aria-label="아래로">↓</button><button class="x" data-act="delComp" data-i="' + i + '" aria-label="삭제">✕</button></span></div>' +
        '<div class="grid2">' + F("s4.components." + i + ".role", "하는 일 (언제·어떻게 작동하나요?)", { rows: 2, ph: "예: 우산 천에서 흘러내린 빗물을 담는다." }) +
        F("s4.components." + i + ".relation", "어디에 있고, 무엇과 어떻게 연결되나요?", { rows: 2, ph: "예: 우산대의 아래쪽 끝에 끼워진다." }) + "</div>" +
        (c.core ? F("s4.components." + i + ".claimPhrase", "청구항에 쓸 꾸밈말", { hint: "어떤 " + esc(c.name || "부품") + "인지 '~하는'으로 꾸며요. 청구항 1에 그대로 들어가요.", ph: "예: 우산대의 아래쪽 끝에 결합되어 빗물을 모으는" }) : "") +
        F("s4.components." + i + ".features", "더 자세한 특징 (한 줄에 하나)", { rows: 2, hint: "'~한', '~인'으로 끝나게 써요. 종속항(청구항 2, 3…)이 돼요.", ph: "예: 접을 수 있는 실리콘으로 만들어진" }) + "</div>";
    }).join("");
    var comp = card("② 부품(구성요소)과 번호(부호)",
      '<p class="sub">큰 부품은 10, 20, 30…, 그 안의 작은 부품은 31, 32…처럼 번호가 저절로 붙어요. <b>꼭 필요한 부분</b>에 체크한 부품은 청구항 1에 들어가요.</p>' +
      (list || '<p class="empty">부품을 추가해 주세요.</p>') + '<button class="btn" data-act="addComp">+ 부품 추가</button>' +
      tip("청구항 1에는 꼭 필요한 부품만 넣어야 권리 범위가 넓어져요. 재료·크기 같은 세부 내용은 '더 자세한 특징'으로 빼세요.", true) +
      tip("부품 이름은 넓은 뜻의 말로 써요. 예: 'LCD 화면'보다 '디스플레이', '고무줄'보다 '탄성 부재'. 그래야 비슷하게 바꾼 물건도 내 권리에 들어가요.", true));

        '<div class="row"><button class="btn" data-act="draw" data-i="' + i + '">✏️ ' + (d.img ? "고치기" : "그리기") + '</button><button class="btn ghost" data-act="photo" data-i="' + i + '">📷 사진 올리기</button><button class="x" data-act="del" data-list="s4.drawings" data-i="' + i + '" aria-label="도면 삭제">✕</button></div></div></div>';
    }).join("");
    var dr = card("③ 도면 그리기",
      '<div class="rules"><b>도면 규칙</b> 흰 바탕에 <b>검은 선</b>으로 그려요 · 색칠하지 않아요 · 설명 글 대신 <b>부호 숫자</b>만 붙여요 · 손으로 그린 그림은 사진을 올린 뒤 \'흑백 선명하게\'를 눌러요<br><b>AI로 만든 그림</b>은 참고만 해요. 내가 정하지 않은 부품, 그림 속 글자·영어 설명이 있으면 그대로 쓰지 말고 다시 그려요. (명세서와 도면이 서로 맞아야 해요)</div>' +
      tip("<b>어느 쪽에서 본 그림일까요?</b> 사시도는 비스듬히 위에서 본 입체 그림(등각투상처럼), 정면도·평면도·측면도는 한 방향에서 똑바로 본 그림(정투상)이에요. 기술·가정 시간에 배운 투상법으로 그려요.") +
      tip("센서·앱·전기 회로처럼 <b>기능으로 나뉘는 발명</b>은 그림판의 '🧩 부품 블록도'를 눌러 네모 칸 그림(블록도)을 만들 수 있어요. 블록도에는 칸 안에 짧은 이름을 써도 돼요.") +
      aiDrawBox() +

    var us = card("④ 사용 방법",

      (deep() ? F("s4.variants", "심화: 다르게 만들 수도 있어요 (변형예, 한 줄에 하나)", { rows: 3, ph: "예: 물받이 컵을 주름 모양으로 만들어 접을 수 있게 한다." }) +
        tip("변형예를 적어 두면 비슷하게 바꾼 물건까지 내 권리로 설명할 수 있어요.", true) : ""));
    return t + comp + dr + us;
  }

  // 수업 PPT 프롬프트 6과 같은 꼴 (손 스케치를 첨부해 선 그림으로 바꾸기)

  // ------------------------------------------------------------ 7. 점검하고 보내기
  function s7() {
    var pr = SC.progress(P), checks = SC.runChecks(P);
    var bars = '<div class="bars">' + STEPS.map(function (s) {
      var pct = Math.round(pr[s.n] * 100);
      return '<button class="barrow" data-act="go" data-n="' + s.n + '"><span>' + s.n + ". " + s.t + '</span><span class="bar big"><i style="width:' + pct + '%"></i></span><b>' + pct + "%</b></button>";
    }).join("") + "</div>";
    var groups = { error: [], warn: [], info: [] };
    checks.forEach(function (c) { groups[c.level].push(c); });
    function list(lv, title) {
      if (!groups[lv].length) return "";
      return '<h4 class="lv ' + lv + '">' + title + " (" + groups[lv].length + ")</h4><ul class=\"checks\">" + groups[lv].map(function (c) {
        return '<li class="' + lv + '"><span>' + esc(c.msg) + '</span><button class="btn ghost small" data-act="go" data-n="' + c.step + '">' + c.step + "단계로 →</button></li>";
      }).join("") + "</ul>";
    }
    var a = card("① 단계별 진행", bars);
    var b = card("② 자동 점검", checks.length ? list("error", "✗ 꼭 고쳐요") + list("warn", "⚠ 확인해요") + list("info", "ℹ 알아 두면 좋아요")
      : '<div class="okbox">🎉 자동 점검에서 문제가 없어요! 선생님께 파일을 보내 확인을 받아요.</div>');
    var cms = P.teacher && P.teacher.comments ? Object.keys(P.teacher.comments).filter(function (k) { return (P.teacher.comments[k] || "").trim(); }) : [];
    var c = cms.length ? card("👩‍🏫 선생님 한마디", cms.map(function (k) { return '<div class="tcomment"><b>' + k + "단계 " + STEPS[k - 1].t + "</b><p>" + esc(P.teacher.comments[k]).replace(/\n/g, "<br>") + "</p></div>"; }).join("")) : "";
    var d = card("③ 저장하고 보내기",
      '<div class="exports">' +
      '<button class="exp" data-act="saveFile"><span>💾</span><b>프로젝트 파일 저장</b><small>선생님께 보내는 파일(.json)이에요. 다음에 이어서 할 때도 써요.</small></button>' +
      '<button class="exp" data-act="docx"><span>📄</span><b>명세서 — 워드(.docx)</b><small>명세서 양식을 본뜬 <b>학습용 초안</b>이에요. 실제 출원은 특허로 공식 템플릿에 옮겨 써요.</small></button>' +
      '<button class="exp" data-act="hwpx"><span>📄</span><b>명세서 — 한글(.hwpx)</b><small>한글에서 열어 고칠 수 있는 <b>학습용 초안</b>이에요.</small></button>' +
      '<button class="exp" data-act="print"><span>🖨️</span><b>인쇄용 보기</b><small>종이로 확인하거나 PDF로 저장해요.</small></button></div>' +
      '<p class="mini">내려받은 파일은 보통 \'다운로드\' 폴더에 저장돼요. 주민등록번호·주소 같은 개인정보는 명세서에 쓰지 않아요.</p>' +
      '<div class="infobox"><b>학습용 파일과 제출용 파일은 달라요.</b> 이 웹앱은 학습 도구예요. 실제로 출원할 때는 특허로(Easy출원)에서 공식 명세서 템플릿을 내려받아 옮겨 쓰고, 제출한 뒤에는 \'전자화 결과\'가 원본과 같은지 확인해요(다르면 확인한 날부터 30일 안에 정정신청).</div>');
    return a + b + c + d;
  }

      '<button class="btn ghost small" data-t="undo">↶ 되돌리기</button><button class="btn ghost small" data-t="clear">모두 지우기</button><button class="btn ghost small" data-t="block">🧩 부품 블록도</button>' +
      '<label class="btn ghost small filebtn">📷 사진 불러오기<input type="file" accept="image/*" data-t="photo" hidden></label>' +
      '<label>흑백 선명하게 <input type="range" min="0" max="255" value="160" data-t="th"></label><button class="btn ghost small" data-t="bw">적용</button></div>' +
      '<p class="mini">🔢 부호: 부품 위에서 눌러 끌면 지시선과 번호가 붙어요. 사진은 손으로 그린 그림을 찍어 올린 뒤 \'흑백 선명하게\'를 눌러요. 🧩 부품 블록도: 4단계 부품 목록으로 네모 칸 그림을 만들어요.</p>' +
      '<div class="canvaswrap"><canvas width="1000" height="750"></canvas></div></div>';
    document.body.appendChild(m);
    var cv = m.querySelector("canvas"), ctx = cv.getContext("2d"), tool = "pen", hist = [], drawing = false, sx = 0, sy = 0, snap = null, madeBlock = false;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    function push() { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 30) hist.shift(); }
    function loadImg(src, fit) {
      var im = new Image();
      im.onload = function () {
        push();
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
        var s = fit ? Math.min(cv.width / im.width, cv.height / im.height) : 1;
        if (!fit && (im.width > cv.width || im.height > cv.height)) s = Math.min(cv.width / im.width, cv.height / im.height);
        var w = im.width * s, h = im.height * s;
        ctx.drawImage(im, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
        grayscale();
      };
      im.src = src;
    }
    function grayscale() {
      var id = ctx.getImageData(0, 0, cv.width, cv.height), a = id.data;
      for (var i = 0; i < a.length; i += 4) { var g = a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114; a[i] = a[i + 1] = a[i + 2] = g; a[i + 3] = 255; }
      ctx.putImageData(id, 0, 0);
    }
    function threshold(t) {
      push();
      var id = ctx.getImageData(0, 0, cv.width, cv.height), a = id.data;
      for (var i = 0; i < a.length; i += 4) { var g = a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114, v = g < t ? 0 : 255; a[i] = a[i + 1] = a[i + 2] = v; a[i + 3] = 255; }
      ctx.putImageData(id, 0, 0);
    }
    if (d.img) loadImg(d.img, false);
    function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
    function lw() { return Number(m.querySelector('[data-t="width"]').value); }
    cv.addEventListener("pointerdown", function (e) {
      e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true;
      var q = pos(e); sx = q[0]; sy = q[1]; push(); snap = ctx.getImageData(0, 0, cv.width, cv.height);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (tool === "pen" || tool === "erase") { ctx.beginPath(); ctx.moveTo(sx, sy); }

    function shape(x, y) {
      ctx.strokeStyle = "#000"; ctx.lineWidth = tool === "label" ? 2 : lw();

      else if (tool === "circle") { ctx.ellipse((sx + x) / 2, (sy + y) / 2, Math.abs(x - sx) / 2 || 1, Math.abs(y - sy) / 2 || 1, 0, 0, Math.PI * 2); ctx.stroke(); }
      if (tool === "label") {
        var n = m.querySelector('[data-t="num"]').value;

    });
    m.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.tool) { tool = b.dataset.tool; m.querySelectorAll("[data-tool]").forEach(function (x) { x.classList.toggle("on", x === b); }); return; }
      var t = b.dataset.t;
      if (t === "undo" && hist.length) ctx.putImageData(hist.pop(), 0, 0);
      else if (t === "clear" && confirm("그림을 모두 지울까요?")) { push(); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); }
      else if (t === "bw") threshold(Number(m.querySelector('[data-t="th"]').value));
      else if (t === "block") drawBlock();
      else if (t === "cancel") m.remove();
      else if (t === "done") {
        var out = cropCanvas(cv);
        d.img = out.url; d.w = out.w; d.h = out.h;
        if (madeBlock) d.kind = "블록도";
        m.remove(); touch(); rerenderMain(); toast("도 " + (idx + 1) + "을(를) 저장했어요.");
      }
    });
    function fitText(txt, x, y, maxW, size, bold, align) {
      var sz = size;
      do { ctx.font = (bold ? "bold " : "") + sz + "px 'Malgun Gothic', sans-serif"; sz -= 1; } while (ctx.measureText(txt).width > maxW && sz > 12);
      ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(txt, x, y);
    }
    function lead(x1, y1, x2, y2, num) {
      ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      fitText(String(num || ""), x2 + 8, y2, 80, 28, true, "left");
    }
    // 큰 부품은 바깥 네모, 그 안의 작은 부품은 안쪽 네모로 그리고 지시선에 부호를 붙인다
    function drawBlock() {
      var tops = SC.topLevel(P).filter(function (c) { return (c.name || "").trim(); });
      if (!tops.length) { toast("4단계 ②에서 부품을 먼저 적어요.", "bad"); return; }
      if (!confirm("부품 목록으로 블록도를 그릴까요? 지금 그림은 지워져요. (↶ 되돌리기로 돌아갈 수 있어요)")) return;
      push(); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
      var HEAD = 64, CH = 52, GAP = 14, PADB = 18, VG = 48, BW = 600, LX = 690;
      var blocks = tops.map(function (c) { return { c: c, kids: SC.childrenOf(P, c.id).filter(function (k) { return (k.name || "").trim(); }) }; });
      var hs = blocks.map(function (b) { return HEAD + b.kids.length * (CH + GAP) + (b.kids.length ? PADB : 0); });
      var total = hs.reduce(function (a, b) { return a + b; }, 0) + VG * (blocks.length - 1);
      var s = Math.min(1, (cv.height - 80) / total, (cv.width - 60) / 790);

        lead(bx + BW - 40, cy, bx + LX, cy - 18, b.c.num);
        b.kids.forEach(function (k, j) {
          var ky = y + HEAD + j * (CH + GAP);
          ctx.lineWidth = 2; ctx.strokeRect(bx + 50, ky, BW - 140, CH);
          fitText(k.name.trim(), bx + 50 + (BW - 140) / 2, ky + CH / 2, BW - 180, 24, false, "center");
          lead(bx + BW - 110, ky + CH / 2, bx + LX, ky + CH / 2 + 10, k.num);
        });
        if (i < blocks.length - 1) { ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx + BW / 2, y + h); ctx.lineTo(bx + BW / 2, y + h + VG); ctx.stroke(); }
        y += h + VG;
      });
      ctx.restore();
      madeBlock = true;

    }

    });

  }
  function cropCanvas(cv) {
    var ctx = cv.getContext("2d"), id = ctx.getImageData(0, 0, cv.width, cv.height).data, minX = cv.width, minY = cv.height, maxX = -1, maxY = -1;
    for (var y = 0; y < cv.height; y += 2) for (var x = 0; x < cv.width; x += 2) {
      var i = (y * cv.width + x) * 4;

    }

    var pad = 30; minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(cv.width, maxX + pad); maxY = Math.min(cv.height, maxY + pad);

  }

    triz2idea: function () {
      var c = P.s2.contradiction;
      if (!(c.idea || "").trim()) { toast("아이디어 칸을 먼저 채워요.", "bad"); return; }
      P.s2.ideas.push({ id: uid("i"), tech: "모순 풀기 · " + (c.principle || ""), name: c.idea.trim().slice(0, 40), desc: c.idea.trim() });
      touch(); rerenderMain(); toast("아이디어 목록에 넣었어요.");
    },
    addComp: function () { P.s4.components.push({ id: uid("c"), name: "", parent: null, core: true, role: "", relation: "", claimPhrase: "", features: "" }); SC.renumber(P); touch(); rerenderMain(); focusLast(".cname"); },
    delComp: function (b) {
      var c = P.s4.components[Number(b.dataset.i)];
      if (!confirm("'" + (c.name || "이 부품") + "'을(를) 지울까요?" + (P.s4.components.some(function (k) { return k.parent === c.id; }) ? " 안에 있는 작은 부품도 함께 지워져요." : ""))) return;
      P.s4.components = P.s4.components.filter(function (k) { return k.id !== c.id && k.parent !== c.id; });
      SC.renumber(P); touch(); rerenderMain();
    },
    moveComp: function (b) {
      var cs = P.s4.components, i = Number(b.dataset.i), c = cs[i], d = Number(b.dataset.d);
      var sibs = cs.filter(function (k) { return (k.parent || null) === (c.parent || null); }), si = sibs.indexOf(c), sj = si + d;
      if (sj < 0 || sj >= sibs.length) return;
      var a = cs.indexOf(sibs[si]), z = cs.indexOf(sibs[sj]); cs[a] = sibs[sj]; cs[z] = sibs[si];
      SC.renumber(P); touch(); rerenderMain();
    },
    addDrawing: function () { P.s4.drawings.push({ id: uid("d"), kind: P.s4.drawings.length ? "단면도" : "사시도", caption: "", img: "", w: 0, h: 0 }); touch(); rerenderMain(); },
    draw: function (b) { openDrawer(Number(b.dataset.i), false); },
    photo: function (b) { openDrawer(Number(b.dataset.i), true); },
    addKw: function () { P.s5.keywords.push({ word: "", synonyms: "" }); touch(); rerenderMain(); focusLast(".kw input"); },
    kwFromComp: function () {
      var have = P.s5.keywords.map(function (k) { return k.word; });
      var words = [(P.s1.product || "").trim()].concat(SC.coreList(P).map(function (c) { return c.name; }))
        .filter(function (w, i, a) { return w && have.indexOf(w) < 0 && a.indexOf(w) === i; }).slice(0, Math.max(0, 3 - have.length));
      words.forEach(function (w) { P.s5.keywords.push({ word: w, synonyms: "" }); });
      P.s5.query = SC.searchQuery(P.s5.keywords, P.s5.exclude); touch(); rerenderMain();
      toast(words.length ? words.length + "개 단어를 가져왔어요. 비슷한 말을 채워 주세요." : "핵심 단어는 2~3개면 충분해요. 더 넣으면 검색 결과가 너무 줄어요.");
    },
    copyQuery: function () {
      var q = P.s5.query || "";
      if (!q) { toast("검색식이 비어 있어요.", "bad"); return; }
      P.s5.searchDate = SC.ymd(new Date()); touch();
      var f = document.getElementById("f_s5_searchDate"); if (f) f.value = P.s5.searchDate;
      (navigator.clipboard ? navigator.clipboard.writeText(q) : Promise.reject()).then(function () { toast("검색식을 복사했어요. KIPRIS 검색창에 붙여 넣으세요."); },
        function () { var r = document.createRange(); r.selectNodeContents(document.getElementById("queryOut")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Ctrl+C로 복사하세요."); });
    },
    addFound: function () { P.s5.found.push({ no: "", title: "", url: "", status: "", relevance: "", seen: {}, memo: "", similar: "", differ: "", improve: "", compare: {} }); touch(); rerenderMain(); },
    draftEmpty: function () { SC.draftAll(P, true); touch(); rerenderMain(); toast("빈 칸을 채웠어요. 꼭 읽어 보고 고쳐요."); },
    draftAllConfirm: function () { if (!confirm("명세서의 모든 칸을 앞 단계 내용으로 다시 만들까요? 내가 고친 문장이 사라져요.")) return; SC.draftAll(P, false); touch(); rerenderMain(); },
    draft: function (b) {
      var f = b.dataset.f, cur = String(P.s6[f] || "").trim();
      var val = SC.drafts[f === "effectsText" ? "effects" : f](P);
      if (cur && cur !== val && !confirm("이 칸을 다시 만들까요? 지금 쓴 내용은 바뀌어요.")) return;
      P.s6[f] = val; touch(); rerenderMain();
      if (!val) toast("앞 단계 내용이 부족해서 만들 수 없어요.", "bad");
    },
    addEffect: function () { P.s6.effects.push({ cause: "", result: "" }); touch(); rerenderMain(); },
    draftClaims: function () {
      if ((P.s6.claims || []).some(function (c) { return (c.text || "").trim(); }) && !confirm("청구항을 다시 만들까요? 지금 쓴 청구항은 바뀌어요.")) return;
      P.s6.claims = SC.drafts.claims(P); touch(); rerenderMain();
      if (!P.s6.claims.length) toast("4단계에서 부품을 먼저 적어 주세요.", "bad");
    },
    addClaim: function () {
      var t = (P.s6.title || "발명").trim();
      P.s6.claims.push({ type: "dep", ref: "1", text: "청구항 1에 있어서,\n상기 ○○" + "은(는) ~인 것을 특징으로 하는 " + t + "." });
      touch(); rerenderMain();
    },
    moveClaim: function (b) {
      var cl = P.s6.claims, i = Number(b.dataset.i), j = i + Number(b.dataset.d);
      if (j < 0 || j >= cl.length) return;
      var x = cl[i]; cl[i] = cl[j]; cl[j] = x; touch(); rerenderMain();
    },
    tTab: function (b) { tTab = b.dataset.v; render(); },
    tOpen: function (b) { tSel = Number(b.dataset.i); render(); var el = document.querySelector(".tdetail"); if (el) el.scrollIntoView({ behavior: "smooth" }); },
    tSave: function () { var p = TF[tSel]; p.updatedAt = new Date().toISOString(); download(SC.fileBase(p) + "_선생님코멘트.json", JSON.stringify(p, null, 1), "application/json"); },
    tDocx: function () { exportDocx(TF[tSel]); },
    tHwpx: function () { exportHwpx(TF[tSel]); },
    tClear: function () { if (confirm("목록을 비울까요? (파일 자체는 지워지지 않아요)")) { TF = []; tSel = -1; render(); } },
    tCsv: function () {
      var head = ["학생", "학교", "학년", "발명 이름", "종류"].concat(STEPS.map(function (s) { return s.n + "." + s.t; })).concat(["오류", "경고", "출원번호"]);
      var lines = [head].concat(TF.map(function (p) {
        var pr = SC.progress(p), ch = SC.runChecks(p);
        return [p.student.name, p.student.school, p.student.grade, p.s6.title || (SC.chosenIdea(p) || {}).name || "", p.s4.type === "utility" ? "실용신안" : "특허"]
          .concat(STEPS.map(function (s) { return Math.round(pr[s.n] * 100) + "%"; }))
          .concat([ch.filter(function (c) { return c.level === "error"; }).length, ch.filter(function (c) { return c.level === "warn"; }).length, p.s8.appNo || ""]);
      }));
      download("발명특허교실_현황.csv", "﻿" + lines.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n"), "text/csv");
    }
  };
  function focusLast(sel) { var els = document.querySelectorAll(sel); if (els.length) els[els.length - 1].focus(); }

  // ------------------------------------------------------------ 이벤트
  function onInput(e) {
    var t = e.target;
    if (t.dataset && t.dataset.tk && tSel >= 0) { TF[tSel].teacher.comments[t.dataset.tk] = t.value; return; }
    if (!P || !t.dataset || !t.dataset.k) return;
    if (t.type === "checkbox" || t.type === "radio" || t.tagName === "SELECT") return; // change 이벤트에서 처리
    setPath(P, t.dataset.k, t.value);
    if (t.dataset.q !== undefined) {
      P.s5.query = SC.searchQuery(P.s5.keywords, P.s5.exclude); var q = document.getElementById("queryOut"); if (q) q.textContent = P.s5.query || "(위에 단어를 적으면 검색식이 생겨요)";
      var gq = SC.gpQuery(P.s5.keywords), go = document.getElementById("gpOut"), gl = document.getElementById("gpLink");
      if (gl) gl.setAttribute("href", gpUrl(gq));
      if (go) go.textContent = gq; else if (gq && gl) { touch(); rerenderMain(); var el = document.querySelector('[data-k="' + t.dataset.k + '"]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
    }
    var cnt = document.querySelector('[data-count="' + t.dataset.k + '"]');
    if (cnt) { cnt.textContent = t.value.length + " / " + cnt.dataset.max + "자"; cnt.classList.toggle("over", t.value.length > Number(cnt.dataset.max)); }
    if (t.classList.contains("cname")) { /* 이름만 바뀌면 다시 그리지 않음 */ }
    touch();
  }
  function onChange(e) {
    var t = e.target;
    if (t.dataset && t.dataset.act === "loadFile") { readJsonFiles(t.files, function (p) { var all = loadAll(); if (all[p.id] && !confirm("같은 프로젝트가 이 컴퓨터에 있어요. 파일 내용으로 바꿀까요?")) return; openProject(p); toast("불러왔어요."); }); return; }
    if (t.dataset && t.dataset.act === "tLoad") { addTeacherFiles(t.files); return; }
    if (!P || !t.dataset || !t.dataset.k) return;
    var v = t.type === "checkbox" ? t.checked : (t.dataset.num !== undefined ? Number(t.value) : t.value);
    if (t.type === "radio" && !t.checked) return;
    setPath(P, t.dataset.k, v);
    if (t.dataset.k === "s3.chosen" && !String(P.s6.title || "").trim()) { var ci = SC.chosenIdea(P); if (ci && ci.name) P.s6.title = ci.name; }
    if (/^s4\.components\.\d+\.parent$/.test(t.dataset.k)) {
      if (!v) setPath(P, t.dataset.k, null);
      else setPath(P, t.dataset.k.replace(/parent$/, "core"), false); // 작은 부품은 보통 종속항에서 다룸
      SC.renumber(P);
    }
    touch();
    if (t.dataset.rr !== undefined || /\.parent$/.test(t.dataset.k)) rerenderMain();
  }
  function addTeacherFiles(files) {
    readJsonFiles(files, function (p) {
      var i = TF.findIndex(function (x) { return x.id === p.id; });
      if (i >= 0) TF[i] = p; else TF.push(p);
      TF.sort(function (a, b) { return String(a.student.name).localeCompare(String(b.student.name), "ko"); });
      render();
    });
  }
  function onClick(e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.tagName === "INPUT") return;
    var fn = ACT[b.dataset.act];
    if (fn) { e.preventDefault(); fn(b); }
  }

  // ------------------------------------------------------------ 시작
  document.addEventListener("DOMContentLoaded", function () {
    appEl = document.getElementById("app");
    document.addEventListener("click", onClick);
    document.addEventListener("input", onInput);
    document.addEventListener("change", onChange);
    document.addEventListener("dragover", function (e) { if (view === "teacher") { e.preventDefault(); var d = document.getElementById("drop"); if (d) d.classList.add("over"); } });
    document.addEventListener("dragleave", function () { var d = document.getElementById("drop"); if (d) d.classList.remove("over"); });
    document.addEventListener("drop", function (e) { if (view === "teacher") { e.preventDefault(); addTeacherFiles(e.dataTransfer.files); } });
    window.addEventListener("beforeunload", function () { if (P) persist(); });
    // 여러 학생이 한 컴퓨터를 함께 쓰므로 항상 처음 화면(프로젝트 목록)에서 시작한다
    // 시연용 주소: #demo-4 (예시를 4단계로 열기), #demo-teacher (선생님 화면에 예시 넣기)
    var demo = (location.hash || "").match(/^#demo(?:-(\d|teacher))?$/);
    if (demo && window.EXAMPLE_PROJECT) {
      var ex = SC.upgrade(JSON.parse(JSON.stringify(window.EXAMPLE_PROJECT)));
      if (demo[1] === "teacher") { TF = [ex]; tSel = 0; view = "teacher"; }
      else { P = ex; view = "step"; step = Number(demo[1]) || 1; }
    }
    render();
  });
})();

</script>
</body>
</html>

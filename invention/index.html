<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발명특허교실</title>
<meta name="description" content="생활 속 불편 찾기부터 명세서 작성, 특허 출원까지 8단계로 안내하는 학생용 발명 교실">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💡%3C/text%3E%3C/svg%3E">
<style>
:root {
  --ink: #1d2433; --sub: #5a6478; --line: #dde2ec; --bg: #f4f6fb; --card: #ffffff;
  --pri: #2457c5; --pri-soft: #e8eefc; --acc: #f0a43a; --acc-soft: #fff4e2;
  --ok: #1f8a5b; --ok-soft: #e6f6ee; --bad: #c8392b; --bad-soft: #fdeceb; --warn: #b7791f; --warn-soft: #fff6e0;
  --deep: #6b4fbb; --deep-soft: #f1edfb; --radius: 14px;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pri); }
:focus-visible { outline: 3px solid #8fb0f5; outline-offset: 2px; }

/* ---------- 상단 ---------- */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--line);
}
.brand { border: 0; background: none; font-weight: 800; font-size: 1.15rem; cursor: pointer; padding: 4px 6px; color: var(--pri); }
.who { display: flex; gap: 10px; align-items: baseline; min-width: 0; flex: 1; }
.who .ttl { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.save { font-size: .85rem; color: var(--ok); white-space: nowrap; }
.save.saving { color: var(--sub); }
.save.full { color: var(--bad); font-weight: 700; }

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--pri); background: #fff; color: var(--pri);
  border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; text-decoration: none; line-height: 1.3;
}
.btn:hover { background: var(--pri-soft); }
.btn.primary { background: var(--pri); color: #fff; }
.btn.primary:hover { background: #1b47a8; }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { background: #eef1f7; }
.btn.small { padding: 4px 10px; font-size: .88rem; }
.btn.big { padding: 12px 22px; font-size: 1.05rem; }
.filebtn { cursor: pointer; }
.x { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 9px; cursor: pointer; color: var(--sub); }
.x:hover { color: var(--bad); border-color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; }
.seg button.on { background: var(--pri); color: #fff; font-weight: 700; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

/* ---------- 레이아웃 ---------- */
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 20px; }
.side { position: sticky; top: 70px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
.phase { font-size: .78rem; font-weight: 700; color: var(--sub); margin: 12px 4px 2px; letter-spacing: .02em; }
.stepbtn {
  display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto 6px; gap: 2px 8px; align-items: center;
  border: 1px solid transparent; background: none; border-radius: 12px; padding: 8px 10px; text-align: left; cursor: pointer;
}
.stepbtn:hover { background: #fff; border-color: var(--line); }
.stepbtn.on { background: #fff; border-color: var(--pri); box-shadow: 0 2px 8px rgba(36, 87, 197, .1); }
.stepbtn .num { grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--pri-soft); color: var(--pri); display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.stepbtn.on .num { background: var(--pri); color: #fff; }
.stepbtn .lbl { font-weight: 600; font-size: .95rem; }
.bar { display: block; height: 6px; background: #e5e9f2; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; transition: width .3s; }
.bar.big { height: 10px; flex: 1; }
main { min-width: 0; outline: none; }

/* ---------- 단계 머리 ---------- */
.stephead { background: linear-gradient(135deg, #fff 60%, var(--pri-soft)); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; }
.stephead .badge { display: inline-block; background: var(--pri); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: .85rem; font-weight: 700; }
.stephead h2 { margin: 8px 0 4px; font-size: 1.6rem; }
.goal { margin: 0 0 8px; font-size: 1.05rem; }
.todo { margin: 0; padding-left: 20px; color: var(--sub); }
.tcomment { margin-top: 12px; background: var(--acc-soft); border: 1px solid #f3cf95; border-radius: 12px; padding: 10px 14px; }
.tcomment p { margin: 4px 0 0; }

/* ---------- 카드·필드 ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px; }
.card h3 { margin: 0 0 6px; font-size: 1.15rem; }
.card h4 { margin: 14px 0 6px; }
.card.sec h3 { color: var(--pri); }
.sub { margin: 0 0 12px; color: var(--sub); }
.mini { font-size: .88rem; color: var(--sub); margin: 4px 0; }
.empty { color: var(--sub); background: #f7f8fb; border: 1px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; }
.fld { margin: 10px 0; }
.fld label { display: block; font-weight: 700; margin-bottom: 4px; }
.fld input, .fld textarea, .fld select, .kw input, .eff input, .claim textarea, .memo input, .comp-h input {
  width: 100%; border: 1px solid #cdd4e1; border-radius: 10px; padding: 9px 12px; background: #fff;
}
.fld textarea, .claim textarea { resize: vertical; min-height: 44px; }
.fld input:focus, .fld textarea:focus, .kw input:focus, .eff input:focus, .claim textarea:focus { border-color: var(--pri); outline: none; box-shadow: 0 0 0 3px var(--pri-soft); }
select { border: 1px solid #cdd4e1; border-radius: 10px; padding: 7px 10px; background: #fff; max-width: 100%; }
.hint { margin: 0 0 6px; font-size: .9rem; color: var(--sub); }
.ex { margin: 4px 0 0; font-size: .88rem; color: #7a8395; }
.count { margin: 4px 0 0; font-size: .85rem; color: var(--sub); text-align: right; }
.count.over { color: var(--bad); font-weight: 700; }
.term { display: inline-block; font-size: .75rem; font-weight: 600; color: var(--deep); background: var(--deep-soft); border-radius: 6px; padding: 0 6px; vertical-align: middle; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.tip { margin: 10px 0 0; background: var(--acc-soft); border-radius: 10px; padding: 9px 12px; font-size: .93rem; }
.tip.deep { background: var(--deep-soft); }
.tip.deep b { color: var(--deep); }
.warnbox { margin-top: 12px; background: var(--warn-soft); border: 1px solid #f0d28a; border-radius: 10px; padding: 10px 14px; }
.okbox { background: var(--ok-soft); border: 1px solid #a9dcc2; border-radius: 10px; padding: 12px 14px; font-weight: 600; }
.okbox.big { font-size: 1.15rem; text-align: center; padding: 20px; }
.rules { background: #f7f8fb; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: .93rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip.on { background: var(--pri); border-color: var(--pri); color: #fff; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 6px 2px; cursor: pointer; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.check.big { padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.radio { white-space: nowrap; cursor: pointer; }
.pill { display: inline-block; background: var(--pri-soft); color: var(--pri); border-radius: 999px; padding: 0 10px; font-weight: 700; font-size: .85rem; }
.pill.indep { background: var(--acc-soft); color: #9a5b00; }

/* 1단계 메모 */
.memo { list-style: none; padding: 0; margin: 0 0 8px; }
.memo li { display: flex; gap: 6px; margin-bottom: 6px; }

/* 2단계 */
.techs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tech { display: flex; flex-direction: column; gap: 3px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.tech:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0, 0, 0, .08); border-color: var(--pri); }
.tech.pick { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.tech .ic { font-size: 1.6rem; }
.tech .q { font-size: .88rem; }
.tech .ex { font-size: .8rem; color: var(--sub); }
.idea { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fbfcfe; }
.idea-h { display: flex; gap: 8px; align-items: center; }
.idea-h select { flex: 1; }
.seps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.sep { text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; }
.sep span { font-size: .88rem; color: var(--sub); }
.sep.on { border-color: var(--deep); background: var(--deep-soft); }

/* 3단계 */
.tablewrap { overflow-x: auto; }
table.score { width: 100%; border-collapse: collapse; }
table.score th, table.score td { border-bottom: 1px solid var(--line); padding: 8px; text-align: center; vertical-align: middle; }
table.score th { background: #f7f8fb; font-size: .9rem; }
table.score td:first-child { text-align: left; }
table.score tr.on td { background: var(--pri-soft); }
table.score .sum { font-weight: 800; font-size: 1.1rem; }
.pmi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 12px; }

/* 4단계 */
.choice2, .choice3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice3 { grid-template-columns: repeat(3, 1fr); }
.opt { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: #fff; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt b { font-size: 1.05rem; }
.opt span { font-size: .9rem; color: var(--sub); }
.opt.on { border-color: var(--pri); background: var(--pri-soft); }
.comp { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fbfcfe; }
.comp.child { margin-left: 34px; border-left: 4px solid var(--pri-soft); }
.comp-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.comp-h .cname { flex: 1 1 200px; font-weight: 700; }
.numb { min-width: 44px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 800; }
.core { display: flex; gap: 4px; align-items: center; white-space: nowrap; font-size: .92rem; cursor: pointer; }
.ctl { display: inline-flex; gap: 4px; }
.draw { display: grid; grid-template-columns: 200px 1fr; gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.thumb { border: 1px solid var(--line); border-radius: 8px; background: #fff; height: 160px; display: grid; place-items: center; overflow: hidden; color: var(--sub); }
.thumb img { max-width: 100%; max-height: 100%; }
.draw-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* 5단계 */
.kw { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; margin-bottom: 8px; }
.query { background: #1d2433; color: #fff; border-radius: 10px; padding: 14px; overflow-x: auto; }
.query code { font-family: Consolas, "D2Coding", monospace; font-size: 1rem; white-space: pre-wrap; word-break: break-all; }
.found { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; background: #fbfcfe; }
.cmps { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0; }
.cmp { display: inline-flex; gap: 6px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; }

/* 6단계 */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; top: 62px; z-index: 5; background: var(--bg); padding: 8px 0; }
.eff { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; }
.claim { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: #fbfcfe; }
.claim-h { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.claim-h .ctl { margin-left: auto; }

/* 7단계 */
.bars { display: grid; gap: 6px; }
.barrow { display: grid; grid-template-columns: 170px 1fr 48px; gap: 10px; align-items: center; border: 0; background: none; text-align: left; cursor: pointer; padding: 4px; border-radius: 8px; }
.barrow:hover { background: #f4f6fb; }
.lv { margin: 12px 0 6px; }
.lv.error { color: var(--bad); } .lv.warn { color: var(--warn); } .lv.info { color: var(--sub); }
ul.checks { list-style: none; padding: 0; margin: 0; }
ul.checks li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; }
ul.checks li.error { background: var(--bad-soft); } ul.checks li.warn { background: var(--warn-soft); } ul.checks li.info { background: #f2f4f8; }
.exports { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.exp { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 14px; cursor: pointer; }
.exp:hover { border-color: var(--pri); background: var(--pri-soft); }
.exp span { font-size: 1.5rem; } .exp small { color: var(--sub); }

/* 처음 화면 */
.home { max-width: 1080px; margin: 0 auto; padding: 24px 20px 40px; }
.hero { text-align: center; padding: 24px 10px 10px; }
.hero h1 { font-size: 2.2rem; margin: 0; color: var(--pri); }
.hero p { font-size: 1.1rem; color: var(--sub); margin: 6px 0 16px; }
.journey { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0; margin: 0 0 18px; counter-reset: j; }
.journey li { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; counter-increment: j; }
.journey li::before { content: counter(j) ". "; color: var(--pri); }
.journey li span { margin-right: 4px; }
.homegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.proj { display: flex; justify-content: space-between; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 10px 0; flex-wrap: wrap; }
.proj .row { margin: 0; }
.foot { text-align: center; margin-top: 16px; }

/* 선생님 화면 */
.teacher { max-width: 1240px; margin: 0 auto; padding: 20px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.tabs button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.drop { display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; border: 2px dashed #b8c3da; border-radius: var(--radius); padding: 26px; background: #fff; cursor: pointer; margin-bottom: 14px; }
.drop.over { border-color: var(--pri); background: var(--pri-soft); }
.drop span { color: var(--sub); font-size: .9rem; }
.minibars { display: flex; gap: 3px; justify-content: center; height: 26px; align-items: flex-end; }
.minibars span { width: 9px; height: 100%; background: #e5e9f2; border-radius: 3px; display: flex; align-items: flex-end; }
.minibars i { display: block; width: 100%; background: var(--ok); border-radius: 3px; }
td.err { color: var(--bad); font-weight: 800; } td.wrn { color: var(--warn); font-weight: 700; }
dl.sum { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 0 0 10px; }
dl.sum dt { font-weight: 700; color: var(--sub); } dl.sum dd { margin: 0; }
.tcomments textarea { min-height: 40px; }
table.guide td, table.guide th { text-align: left; font-size: .9rem; vertical-align: top; }
.plan { margin: 0; padding-left: 22px; } .plan li { margin: 4px 0; }

/* 명세서 미리보기 */
.specbox { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 24px 30px; max-height: 70vh; overflow: auto; font-family: "Batang", "바탕", serif; color: #000; }
.specbox p { margin: 0 0 6px; line-height: 1.9; }
.specbox .sp-h1 { text-align: center; font-weight: 700; margin-top: 12px; }
.specbox .sp-h2 { font-weight: 700; margin-top: 8px; }
.specbox .sp-p { text-indent: 1em; }
.specbox .sp-break { border-top: 2px dashed #ccc; padding-top: 14px; margin-top: 20px; }
.specbox .sp-img { text-align: center; margin: 6px 0 14px; }
.specbox .sp-img img { max-width: 70%; border: 1px solid #eee; }

/* 모달 */
.modal { position: fixed; inset: 0; background: rgba(20, 26, 40, .55); z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal-in { background: #fff; border-radius: var(--radius); width: min(980px, 100%); max-height: 94vh; overflow: auto; padding: 16px 20px; }
.modal-in.wide { width: min(900px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.modal-h .row { margin: 0; }
.draw-modal { width: min(1100px, 100%); }
.dtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.dtools label { display: inline-flex; gap: 4px; align-items: center; font-size: .9rem; }
.canvaswrap { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.canvaswrap canvas { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; z-index: 200; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); transition: opacity .5s; max-width: 90vw; }
.toast.bad { background: var(--bad); }
.toast.out { opacity: 0; }

/* 단계 이동 */
.stepnav { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0 40px; }

/* 작은 화면 */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  .side { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .phase { display: none; }
  .stepbtn { min-width: 150px; }
  .grid2, .pmi, .homegrid, .choice3, .seps { grid-template-columns: 1fr; }
  .draw { grid-template-columns: 1fr; }
  .kw, .eff { grid-template-columns: 1fr; }
  .barrow { grid-template-columns: 120px 1fr 44px; }
  .comp.child { margin-left: 12px; }
  .toolbar { top: 0; position: static; }
}
@media (max-width: 560px) {
  .choice2 { grid-template-columns: 1fr; }
  .top { padding: 8px 12px; }
  .card { padding: 16px; }
  .stephead h2 { font-size: 1.35rem; }
}

/* 인쇄 */
@media print {
  body.printing > *:not(.modal) { display: none !important; }
  body.printing .modal { position: static; background: none; padding: 0; display: block; }
  body.printing .modal-in { max-height: none; overflow: visible; padding: 0; width: 100%; }
  body.printing .modal-h { display: none; }
  body.printing .specbox { border: 0; max-height: none; overflow: visible; padding: 0; }
  body.printing .sp-break { break-before: page; border: 0; }
}

</style>
</head>

        if (i === 0 && m) add("warn", 6, "청구항 1은 다른 청구항을 인용하지 않아요.", "claims");

  // ---------------------------------------------------------------- 명세서 블록

    body((s6.title || "").trim() + ((s6.titleEn || "").trim() ? "{" + s6.titleEn.trim() + "}" : ""));
    h2("【기술분야】"); body(s6.field);

    }
    h2("【" + I + "의 내용】");
    h2(I === "고안" ? "【해결하고자 하는 과제】" : "【해결하려는 과제】"); body(s6.problem);
    h2("【과제의 해결 수단】"); body(s6.solution);
    h2("【" + I + "의 효과】"); body(s6.effectsText);
    var ds = p.s4.drawings || [];

    h2("【" + I + "을 실시하기 위한 구체적인 내용】"); body(s6.detail);
    if ((s6.symbols || "").trim()) { h2("(【부호의 설명】)"); body(s6.symbols); }
    h1("【청구범위】", true);
    var claims = (s6.claims || []).filter(function (c) { return (c.text || "").trim(); });
    if (!claims.length) { h2("【청구항 1】"); body(""); }
    claims.forEach(function (c, i) { h2("【청구항 " + (i + 1) + "】"); body(c.text); });
    h1("【요약서】", true);
    h2("【요약】"); body(s6.abstract);
    if (ds.length) { h2("【대표도】"); body("도 " + (Number(p.s4.rep) || 1)); }
    if (ds.length) {
      h1("【도면】", true);
      ds.forEach(function (d, i) {

        if (d.img) b.push({ kind: "img", img: d.img, w: d.w || 800, h: d.h || 600, name: "도 " + (i + 1) });

  }

    { k: "재료 바꾸기", ic: "🧪", q: "다른 재료로 만들면 더 좋아질까?", ex: "접을 수 있는 실리콘 컵" },
    { k: "쓰임새 바꾸기", ic: "🔄", q: "다른 곳이나 다른 사람에게 쓰면?", ex: "과자 봉지를 집는 빨래집게" },
    { k: "반대로 생각하기", ic: "🙃", q: "위아래, 안팎, 순서를 거꾸로 하면?", ex: "거꾸로 세워 두는 소스 통" },
    { k: "자연에서 배우기", ic: "🌿", q: "동물이나 식물은 이 문제를 어떻게 해결할까?", ex: "열매 가시를 본뜬 찍찍이" },
    { k: "나누고 접기", ic: "✂️", q: "나누거나, 접거나, 펼치게 하면?", ex: "접어서 들고 다니는 의자" },
    { k: "저절로 되게 하기", ic: "⚙️", q: "사람이 하지 않아도 저절로 되게 하려면?", ex: "사람이 오면 켜지는 센서 등" }
  ];
  var SEPARATIONS = [
    ["공간으로 나누기", "한 부분은 A처럼, 다른 부분은 B처럼 만들어요. (예: 손잡이는 딱딱하고 닿는 곳은 말랑한 칫솔)"],
    ["시간으로 나누기", "쓸 때는 A, 안 쓸 때는 B가 되게 해요. (예: 쓸 때만 펼치는 접이식 의자)"],
    ["조건으로 나누기", "상황(온도·무게 등)에 따라 저절로 바뀌게 해요. (예: 뜨거우면 색이 바뀌는 컵)"],
    ["부분과 전체로 나누기", "부분은 A, 전체는 B가 되게 해요. (예: 마디는 단단하지만 전체는 휘는 자전거 체인)"]
  ];
  var WHO = ["나", "친구", "가족", "동생", "할머니·할아버지", "선생님", "몸이 불편한 사람", "반려동물"];
  var WHERE = ["교실", "급식실", "집", "부엌", "화장실", "길·버스", "운동장·놀이터", "여행·캠핑"];
  var KINDS = ["사시도", "정면도", "측면도", "평면도", "단면도", "분해 사시도", "사용 상태도", "확대도"];
  var NOT_PAT = [
    ["nature", "자연법칙 그 자체예요 (예: 중력, 에너지 보존)"],
    ["abstract", "어떻게 만드는지 없이 생각(바람)만 있어요"],
    ["art", "그림·노래·이야기 같은 예술 작품이에요 (→ 저작권)"],
    ["medical", "사람 몸을 수술·치료·진단하는 방법이에요"],
    ["impossible", "실제로 만들거나 되풀이해서 쓸 수 없어요"]
  ];

  // ------------------------------------------------------------ 폼 조각
  function F(path, label, o) {
    o = o || {};
    var v = getPath(P, path); v = v == null ? "" : v;
    var id = "f_" + path.replace(/\W/g, "_");
    var ctl = o.rows
      ? '<textarea id="' + id + '" data-k="' + path + '" rows="' + o.rows + '" placeholder="' + esc(o.ph || "") + '">' + esc(v) + "</textarea>"
      : '<input id="' + id + '" data-k="' + path + '" type="text" value="' + esc(v) + '" placeholder="' + esc(o.ph || "") + '">';
    return '<div class="fld ' + (o.cls || "") + '"><label for="' + id + '">' + label + (o.term ? ' <span class="term">' + o.term + "</span>" : "") + "</label>" +
      (o.hint ? '<p class="hint">' + o.hint + "</p>" : "") + ctl +
      (o.ex ? '<p class="ex">예) ' + esc(o.ex) + "</p>" : "") +
      (o.count ? '<p class="count" data-count="' + path + '" data-max="' + o.count + '">' + String(v).length + " / " + o.count + "자</p>" : "") + "</div>";
  }
  function chips(path, list) {
    var cur = getPath(P, path) || "";
    return '<div class="chips">' + list.map(function (x) {
      return '<button type="button" class="chip' + (cur === x ? " on" : "") + '" data-act="chip" data-k="' + path + '" data-v="' + esc(x) + '">' + esc(x) + "</button>";
    }).join("") + "</div>";
  }
  function card(title, body, o) {
    o = o || {};
    return '<section class="card ' + (o.cls || "") + '">' + (title ? '<h3>' + title + "</h3>" : "") + (o.sub ? '<p class="sub">' + o.sub + "</p>" : "") + body + "</section>";
  }
  function tip(html, deepOnly) {
    if (deepOnly && !deep()) return "";
    return '<div class="tip' + (deepOnly ? " deep" : "") + '">' + (deepOnly ? "<b>심화</b> " : "💡 ") + html + "</div>";
  }
  function sel(path, options, o) {
    o = o || {};
    var cur = getPath(P, path);
    return '<select data-k="' + path + '"' + (o.num ? " data-num" : "") + (o.rr ? " data-rr" : "") + (o.label ? ' aria-label="' + esc(o.label) + '"' : "") + ">" +
      options.map(function (x) { var v = Array.isArray(x) ? x[0] : x, t = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? " selected" : "") + ">" + esc(t) + "</option>"; }).join("") + "</select>";
  }

  // ------------------------------------------------------------ 화면 틀
  function render() {
    var y = window.scrollY;
    if (view === "home") { appEl.innerHTML = homeView(); window.scrollTo(0, 0); return; }
    if (view === "teacher") { appEl.innerHTML = teacherView(); return; }
    appEl.innerHTML = headerView() + '<div class="layout"><nav class="side" aria-label="단계">' + sideView() + '</nav><main id="main" tabindex="-1">' + stepView() + "</main></div>";
    main = document.getElementById("main");
    window.scrollTo(0, y);
    setSave(saveState);
  }
  function rerenderMain() { var y = window.scrollY; main.innerHTML = stepView(); refreshSide(); window.scrollTo(0, y); }
  function goStep(n) { step = n; render(); window.scrollTo(0, 0); var m = document.getElementById("main"); if (m) m.focus({ preventScroll: true }); }

  function headerView() {
    var t = (P.s6.title || (SC.chosenIdea(P) || {}).name || "").trim();
    return '<header class="top"><button class="brand" data-act="home" title="처음 화면">💡 발명특허교실</button>' +
      '<div class="who"><b>' + esc(P.student.name || "이름 없음") + "</b>" + (t ? '<span class="ttl">' + esc(t) + "</span>" : "") + "</div>" +
      '<div class="tools"><div class="seg" role="group" aria-label="설명 수준">' +
      '<button data-act="level" data-v="easy" class="' + (P.level !== "deep" ? "on" : "") + '">쉬운 말</button>' +
      '<button data-act="level" data-v="deep" class="' + (P.level === "deep" ? "on" : "") + '">심화</button></div>' +
      '<span id="saveState" class="save saved">✓ 저장됨</span>' +
      '<button class="btn ghost" data-act="preview">👀 미리보기</button>' +
      '<button class="btn" data-act="saveFile">💾 파일로 저장</button></div></header>';
  }
  function sideView() {
    var pr = SC.progress(P), html = "";
    PHASES.forEach(function (ph) {
      html += '<div class="phase">' + ph[2] + "</div>";
      for (var n = ph[0]; n <= ph[1]; n++) {
        var s = STEPS[n - 1], pct = Math.round(pr[n] * 100);
        html += '<button class="stepbtn' + (n === step ? " on" : "") + '" data-act="go" data-n="' + n + '" aria-current="' + (n === step ? "step" : "false") + '">' +
          '<span class="num">' + (pct >= 100 ? "✓" : n) + '</span><span class="lbl">' + s.ic + " " + s.t + '</span><span class="bar"><i style="width:' + pct + '%"></i></span></button>';
      }
    });
    return html;
  }
  function refreshSide() {
    var side = document.querySelector(".side");
    if (side) side.innerHTML = sideView();
  }
  function stepHead() {
    var s = STEPS[step - 1], cm = (P.teacher && P.teacher.comments && P.teacher.comments[step]) || "";
    return '<div class="stephead"><div class="badge">' + step + '단계</div><h2>' + s.ic + " " + s.t + "</h2><p class=\"goal\">" + s.goal + "</p>" +
      '<ol class="todo">' + s.todo.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ol>" +
      (cm.trim() ? '<div class="tcomment"><b>👩‍🏫 선생님 한마디</b><p>' + esc(cm).replace(/\n/g, "<br>") + "</p></div>" : "") + "</div>";
  }
  function stepNav() {
    return '<div class="stepnav">' + (step > 1 ? '<button class="btn ghost" data-act="go" data-n="' + (step - 1) + '">← ' + STEPS[step - 2].t + "</button>" : "<span></span>") +
      (step < 8 ? '<button class="btn primary" data-act="go" data-n="' + (step + 1) + '">' + STEPS[step].t + " →</button>" : "") + "</div>";
  }
  function stepView() { return stepHead() + [null, s1, s2, s3, s4, s5, s6, s7, s8][step]() + stepNav(); }

  // ------------------------------------------------------------ 1. 문제 찾기
  function s1() {
    var a = card("① 누가, 어디서, 무엇이 불편한가요?",
      '<div class="grid2"><div>' + '<p class="mini">누가 불편한가요?</p>' + chips("s1.who", WHO) + F("s1.who", "직접 쓰기", { ph: "예: 나와 친구들" }) + "</div>" +
      '<div><p class="mini">어디서 불편한가요?</p>' + chips("s1.where", WHERE) + F("s1.where", "직접 쓰기", { ph: "예: 교실 앞 우산꽂이" }) + "</div></div>" +
      F("s1.what", "무엇이 불편한가요?", { ph: "예: 젖은 우산에서 빗물이 흘러내림" }) +
      '<div class="row"><button class="btn" data-act="makeSentence">✍️ 문제 문장 만들기</button></div>' +
      F("s1.sentence", "문제 문장", { rows: 2, hint: "만든 문장을 내 말로 다듬어도 좋아요." }));
    var memo = (P.s1.memo || []).map(function (m, i) {
      return '<li><input data-k="s1.memo.' + i + '" value="' + esc(m) + '" aria-label="불편 메모 ' + (i + 1) + '"><button class="x" data-act="del" data-list="s1.memo" data-i="' + i + '" aria-label="삭제">✕</button></li>';
    }).join("");
    var b = card("② 더 찾은 불편 (메모장)", '<ul class="memo">' + memo + '</ul><button class="btn ghost" data-act="addMemo">+ 불편 메모 추가</button>',
      { sub: "생각난 불편은 일단 다 적어 두세요. 나중에 다른 발명의 씨앗이 돼요." });
    var an = P.s1.analysis;
    var c = card("③ 관련된 물건 살펴보기",
      F("s1.product", "어떤 물건(제품)과 관련 있나요?", { ph: "예: 장우산" }) +
      '<div class="grid2">' +
      F("s1.analysis.purpose", "목적과 기능", { rows: 2, ph: "무엇을 하려고 쓰나요?" }) +
      F("s1.analysis.structure", "구조와 원리", { rows: 2, ph: "어떻게 생겼고 어떻게 움직이나요?" }) +
      F("s1.analysis.shape", "모양과 형태", { rows: 2 }) + F("s1.analysis.size", "크기와 무게", { rows: 2 }) +
      F("s1.analysis.material", "재료", { rows: 2 }) + F("s1.analysis.usage", "사용 방법", { rows: 2 }) + "</div>" +
      tip("여기 쓴 내용은 명세서의 '배경이 되는 기술'로 이어져요.", true), { sub: an ? "물건을 직접 보거나 사진을 보며 칸을 채워요." : "" });
    var d = card("④ 불편한 점과 바꾸고 싶은 점",
      F("s1.inconvenience", "어떤 점이 불편한가요? 자세히 써요", { rows: 3, ex: "젖은 우산을 세워 두면 빗물이 바닥으로 흘러 미끄럽다." }) +
      F("s1.improve", "어떻게 바뀌면 좋을까요?", { rows: 2, hint: "'~할 수 있는'처럼 끝나게 쓰면 명세서에 바로 쓸 수 있어요.", ex: "빗물을 바닥에 흘리지 않고 모을 수 있는" }));
    return a + b + c + d;
  }

  // ------------------------------------------------------------ 2. 아이디어 내기
  function s2() {
    var cards = '<div class="techs">' + TECHS.map(function (t, i) {
      return '<button class="tech" data-act="useTech" data-i="' + i + '"><span class="ic">' + t.ic + "</span><b>" + t.k + "</b><span class=\"q\">" + t.q + '</span><span class="ex">예) ' + t.ex + "</span></button>";
    }).join("") + "</div>";
    var a = card("① 발명 기법 카드", cards + '<div class="row"><button class="btn ghost" data-act="randomTech">🎲 카드 한 장 뽑기</button><span class="mini">카드를 누르면 그 기법으로 아이디어 칸이 생겨요.</span></div>',
      { sub: "문제 문장: <b>" + esc(P.s1.sentence || P.s1.what || "(1단계에서 문제를 먼저 써 주세요)") + "</b>" });
    var ideas = (P.s2.ideas || []).map(function (it, i) {
      return '<div class="idea"><div class="idea-h"><span class="pill">' + (i + 1) + "</span>" +
        sel("s2.ideas." + i + ".tech", [["", "기법 고르기"]].concat(TECHS.map(function (t) { return [t.k, t.ic + " " + t.k]; })).concat([["기타", "기타"]]), { label: "발명 기법" }) +
        '<button class="x" data-act="del" data-list="s2.ideas" data-i="' + i + '" aria-label="아이디어 삭제">✕</button></div>' +
        F("s2.ideas." + i + ".name", "아이디어 이름", { ph: "예: 빗물받이 컵이 달린 우산" }) +
        F("s2.ideas." + i + ".desc", "어떻게 작동하나요?", { rows: 3, ph: "무엇을 어디에 어떻게 바꾸는지 써요." }) + "</div>";
    }).join("");
    var n = (P.s2.ideas || []).length;
    var b = card("② 내 아이디어 (" + n + "개)", (ideas || '<p class="empty">아직 아이디어가 없어요. 위의 카드를 눌러 시작해요.</p>') +
      '<button class="btn" data-act="addIdea">+ 아이디어 추가</button>' + (n && n < 3 ? '<p class="mini">3개 이상 떠올리면 더 좋은 아이디어를 고를 수 있어요.</p>' : ""));
    var c = "";
    if (deep()) {
      c = card("③ 심화: 모순 풀기 (TRIZ 맛보기)",
        '<p class="sub">"무엇을 좋게 하면 다른 것이 나빠지는" 문제를 찾아 나누기 원리로 풀어요.</p><div class="grid2">' +
        F("s2.contradiction.better", "좋게 하고 싶은 것", { ph: "예: 물받이 컵을 크게 하고 싶다" }) +
        F("s2.contradiction.worse", "그러면 나빠지는 것", { ph: "예: 우산이 무겁고 들고 다니기 불편하다" }) + "</div>" +
        '<div class="seps">' + SEPARATIONS.map(function (s) {
          var on = P.s2.contradiction.principle === s[0];
          return '<button class="sep' + (on ? " on" : "") + '" data-act="chip" data-k="s2.contradiction.principle" data-v="' + s[0] + '"><b>' + s[0] + "</b><span>" + s[1] + "</span></button>";
        }).join("") + "</div>" +
        F("s2.contradiction.idea", "이 원리로 떠올린 아이디어", { rows: 2, ph: "예: 쓸 때만 펼쳐지는 주름 컵" }) +
        '<button class="btn ghost" data-act="triz2idea">아이디어 목록에 넣기</button>');
    }
    return a + b + c;
  }

  // ------------------------------------------------------------ 3. 아이디어 고르기
  function s3() {
    var ideas = (P.s2.ideas || []).filter(function (it) { return (it.name || it.desc || "").trim(); });
    if (!ideas.length) return card("", '<p class="empty">2단계에서 아이디어를 먼저 적어 주세요.</p>');
    var opts = [["", "-"], [1, "1 조금"], [2, "2 보통"], [3, "3 많이"]];
    var rows = ideas.map(function (it) {
      var sc = (P.s3.scores[it.id] = P.s3.scores[it.id] || {}), sum = (sc.new || 0) + (sc.better || 0) + (sc.make || 0);
      var on = P.s3.chosen === it.id;
      return "<tr" + (on ? ' class="on"' : "") + "><td><b>" + esc(it.name || "(이름 없음)") + "</b><br><span class=\"mini\">" + esc(it.tech || "") + "</span></td>" +
        ["new", "better", "make"].map(function (k) { return "<td>" + sel("s3.scores." + it.id + "." + k, opts, { num: 1, rr: 1, label: k }) + "</td>"; }).join("") +
        '<td class="sum">' + sum + '</td><td><label class="radio"><input type="radio" name="chosen" data-k="s3.chosen" value="' + it.id + '" data-rr' + (on ? " checked" : "") + "> 고르기</label></td></tr>";
    }).join("");
    var a = card("① 세 가지 질문으로 비교하기",
      '<div class="tablewrap"><table class="score"><thead><tr><th>아이디어</th><th>새로운가요?<br><span class="term">신규성</span></th><th>더 나아졌나요?<br><span class="term">진보성</span></th><th>만들 수 있나요?<br><span class="term">산업상 이용가능성</span></th><th>합계</th><th>선택</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      tip("특허를 받으려면 <b>새롭고(신규성)</b>, 쉽게 생각해 낼 수 없을 만큼 <b>더 나아야 하며(진보성)</b>, 실제로 <b>만들어 쓸 수 있어야(산업상 이용가능성)</b> 해요.", true));
    var ch = SC.chosenIdea(P), b = "";
    if (ch) {
      b = card("② PMI로 따져 보기 — " + esc(ch.name || ""),
        '<div class="pmi">' + F("s3.pmi.p", "P 좋은 점 (Plus)", { rows: 3, ph: "나는 왜 이 아이디어가 좋은가?" }) +
        F("s3.pmi.m", "M 아쉬운 점 (Minus)", { rows: 3, ph: "아쉬운 점이나 걱정되는 점은?" }) +
        F("s3.pmi.i", "I 흥미로운 점 (Interesting)", { rows: 3, ph: "더 발전시키면 재미있을 점은?" }) + "</div>" +
        F("s3.pmi.summary", "종합 의견", { rows: 2 }) +
        tip("M(아쉬운 점)은 숨기지 말고 적어요. 아쉬운 점을 해결하는 방법이 또 하나의 발명 포인트가 돼요."));
    }
    var np = card("③ 특허를 받기 어려운 경우인지 확인해요",

      '<p class="mini">🔢 부호: 부품 위에서 눌러 끌면 지시선과 번호가 붙어요. 사진은 손으로 그린 그림을 찍어 올린 뒤 \'흑백 선명하게\'를 눌러요.</p>' +

    document.body.appendChild(m);
    var cv = m.querySelector("canvas"), ctx = cv.getContext("2d"), tool = "pen", hist = [], drawing = false, sx = 0, sy = 0, snap = null;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    function push() { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 30) hist.shift(); }
    function loadImg(src, fit) {
      var im = new Image();
      im.onload = function () {
        push();
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
        var s = fit ? Math.min(cv.width / im.width, cv.height / im.height) : 1;
        if (!fit && (im.width > cv.width || im.height > cv.height)) s = Math.min(cv.width / im.width, cv.height / im.height);
        var w = im.width * s, h = im.height * s;

    }

    }
    function threshold(t) {
      push();
      var id = ctx.getImageData(0, 0, cv.width, cv.height), a = id.data;
      for (var i = 0; i < a.length; i += 4) { var g = a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114, v = g < t ? 0 : 255; a[i] = a[i + 1] = a[i + 2] = v; a[i + 3] = 255; }
      ctx.putImageData(id, 0, 0);
    }
    if (d.img) loadImg(d.img, false);
    function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }

    cv.addEventListener("pointerdown", function (e) {
      e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true;
      var q = pos(e); sx = q[0]; sy = q[1]; push(); snap = ctx.getImageData(0, 0, cv.width, cv.height);
      ctx.lineCap = "round"; ctx.lineJoin = "round";

      if (!drawing) return;

  function cropCanvas(cv) {
    var ctx = cv.getContext("2d"), id = ctx.getImageData(0, 0, cv.width, cv.height).data, minX = cv.width, minY = cv.height, maxX = -1, maxY = -1;
    for (var y = 0; y < cv.height; y += 2) for (var x = 0; x < cv.width; x += 2) {
      var i = (y * cv.width + x) * 4;
      if (id[i] < 200 || id[i + 1] < 200 || id[i + 2] < 200) { if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
    }
    if (maxX < 0) return { url: cv.toDataURL("image/png"), w: cv.width, h: cv.height };
    var pad = 30; minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(cv.width, maxX + pad); maxY = Math.min(cv.height, maxY + pad);
    var w = maxX - minX, h = maxY - minY, c2 = document.createElement("canvas");
    c2.width = w; c2.height = h; c2.getContext("2d").drawImage(cv, minX, minY, w, h, 0, 0, w, h);

  }

    addEffect: function () { P.s6.effects.push({ cause: "", result: "" }); touch(); rerenderMain(); },
    draftClaims: function () {
      if ((P.s6.claims || []).some(function (c) { return (c.text || "").trim(); }) && !confirm("청구항을 다시 만들까요? 지금 쓴 청구항은 바뀌어요.")) return;
      P.s6.claims = SC.drafts.claims(P); touch(); rerenderMain();
      if (!P.s6.claims.length) toast("4단계에서 부품을 먼저 적어 주세요.", "bad");
    },
    addClaim: function () {
      var t = (P.s6.title || "발명").trim();
      P.s6.claims.push({ type: "dep", ref: "1", text: "청구항 1에 있어서,\n상기 ○○" + "은(는) ~인 것을 특징으로 하는 " + t + "." });
      touch(); rerenderMain();
    },
    moveClaim: function (b) {
      var cl = P.s6.claims, i = Number(b.dataset.i), j = i + Number(b.dataset.d);
      if (j < 0 || j >= cl.length) return;
      var x = cl[i]; cl[i] = cl[j]; cl[j] = x; touch(); rerenderMain();
    },
    tTab: function (b) { tTab = b.dataset.v; render(); },
    tOpen: function (b) { tSel = Number(b.dataset.i); render(); var el = document.querySelector(".tdetail"); if (el) el.scrollIntoView({ behavior: "smooth" }); },
    tSave: function () { var p = TF[tSel]; p.updatedAt = new Date().toISOString(); download(SC.fileBase(p) + "_선생님코멘트.json", JSON.stringify(p, null, 1), "application/json"); },
    tDocx: function () { exportDocx(TF[tSel]); },
    tHwpx: function () { exportHwpx(TF[tSel]); },
    tClear: function () { if (confirm("목록을 비울까요? (파일 자체는 지워지지 않아요)")) { TF = []; tSel = -1; render(); } },
    tCsv: function () {
      var head = ["학생", "학교", "학년", "발명 이름", "종류"].concat(STEPS.map(function (s) { return s.n + "." + s.t; })).concat(["오류", "경고", "출원번호"]);
      var lines = [head].concat(TF.map(function (p) {
        var pr = SC.progress(p), ch = SC.runChecks(p);
        return [p.student.name, p.student.school, p.student.grade, p.s6.title || (SC.chosenIdea(p) || {}).name || "", p.s4.type === "utility" ? "실용신안" : "특허"]
          .concat(STEPS.map(function (s) { return Math.round(pr[s.n] * 100) + "%"; }))
          .concat([ch.filter(function (c) { return c.level === "error"; }).length, ch.filter(function (c) { return c.level === "warn"; }).length, p.s8.appNo || ""]);
      }));
      download("발명특허교실_현황.csv", "﻿" + lines.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n"), "text/csv");
    }
  };
  function focusLast(sel) { var els = document.querySelectorAll(sel); if (els.length) els[els.length - 1].focus(); }

  // ------------------------------------------------------------ 이벤트
  function onInput(e) {
    var t = e.target;
    if (t.dataset && t.dataset.tk && tSel >= 0) { TF[tSel].teacher.comments[t.dataset.tk] = t.value; return; }
    if (!P || !t.dataset || !t.dataset.k) return;
    if (t.type === "checkbox" || t.type === "radio" || t.tagName === "SELECT") return; // change 이벤트에서 처리
    setPath(P, t.dataset.k, t.value);
    if (t.dataset.q !== undefined) { P.s5.query = SC.searchQuery(P.s5.keywords); var q = document.getElementById("queryOut"); if (q) q.textContent = P.s5.query || "(위에 단어를 적으면 검색식이 생겨요)"; }
    var cnt = document.querySelector('[data-count="' + t.dataset.k + '"]');
    if (cnt) { cnt.textContent = t.value.length + " / " + cnt.dataset.max + "자"; cnt.classList.toggle("over", t.value.length > Number(cnt.dataset.max)); }
    if (t.classList.contains("cname")) { /* 이름만 바뀌면 다시 그리지 않음 */ }
    touch();
  }
  function onChange(e) {
    var t = e.target;
    if (t.dataset && t.dataset.act === "loadFile") { readJsonFiles(t.files, function (p) { var all = loadAll(); if (all[p.id] && !confirm("같은 프로젝트가 이 컴퓨터에 있어요. 파일 내용으로 바꿀까요?")) return; openProject(p); toast("불러왔어요."); }); return; }
    if (t.dataset && t.dataset.act === "tLoad") { addTeacherFiles(t.files); return; }
    if (!P || !t.dataset || !t.dataset.k) return;
    var v = t.type === "checkbox" ? t.checked : (t.dataset.num !== undefined ? Number(t.value) : t.value);
    if (t.type === "radio" && !t.checked) return;
    setPath(P, t.dataset.k, v);
    if (t.dataset.k === "s3.chosen" && !String(P.s6.title || "").trim()) { var ci = SC.chosenIdea(P); if (ci && ci.name) P.s6.title = ci.name; }
    if (/^s4\.components\.\d+\.parent$/.test(t.dataset.k)) {
      if (!v) setPath(P, t.dataset.k, null);
      else setPath(P, t.dataset.k.replace(/parent$/, "core"), false); // 작은 부품은 보통 종속항에서 다룸
      SC.renumber(P);
    }
    touch();
    if (t.dataset.rr !== undefined || /\.parent$/.test(t.dataset.k)) rerenderMain();
  }
  function addTeacherFiles(files) {
    readJsonFiles(files, function (p) {
      var i = TF.findIndex(function (x) { return x.id === p.id; });
      if (i >= 0) TF[i] = p; else TF.push(p);
      TF.sort(function (a, b) { return String(a.student.name).localeCompare(String(b.student.name), "ko"); });
      render();
    });
  }
  function onClick(e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.tagName === "INPUT") return;
    var fn = ACT[b.dataset.act];
    if (fn) { e.preventDefault(); fn(b); }
  }

  // ------------------------------------------------------------ 시작
  document.addEventListener("DOMContentLoaded", function () {
    appEl = document.getElementById("app");
    document.addEventListener("click", onClick);
    document.addEventListener("input", onInput);
    document.addEventListener("change", onChange);
    document.addEventListener("dragover", function (e) { if (view === "teacher") { e.preventDefault(); var d = document.getElementById("drop"); if (d) d.classList.add("over"); } });
    document.addEventListener("dragleave", function () { var d = document.getElementById("drop"); if (d) d.classList.remove("over"); });
    document.addEventListener("drop", function (e) { if (view === "teacher") { e.preventDefault(); addTeacherFiles(e.dataTransfer.files); } });
    window.addEventListener("beforeunload", function () { if (P) persist(); });
    // 여러 학생이 한 컴퓨터를 함께 쓰므로 항상 처음 화면(프로젝트 목록)에서 시작한다
    // 시연용 주소: #demo-4 (예시를 4단계로 열기), #demo-teacher (선생님 화면에 예시 넣기)
    var demo = (location.hash || "").match(/^#demo(?:-(\d|teacher))?$/);
    if (demo && window.EXAMPLE_PROJECT) {
      var ex = SC.upgrade(JSON.parse(JSON.stringify(window.EXAMPLE_PROJECT)));
      if (demo[1] === "teacher") { TF = [ex]; tSel = 0; view = "teacher"; }
      else { P = ex; view = "step"; step = Number(demo[1]) || 1; }
    }
    render();
  });
})();

</script>
</body>
</html>
